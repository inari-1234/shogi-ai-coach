name: Build18-6 Real-game E2E

on:
  push:
    branches:
      - 'candidate/build18-6-real-game-e2e'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: build18-6-real-game-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-game-audit:
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gate A — authority audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/gate-a

          git merge-base --is-ancestor 054f30a54463d472cc96a16c49cd14d6e0e28b45 HEAD
          git merge-base --is-ancestor 3ef903e5762e695646204987196e8b8fff500155 HEAD
          git merge-base --is-ancestor 3443b3cb0830783b325fca4bd82fd374a185dc6a HEAD

          if git diff --name-only 054f30a54463d472cc96a16c49cd14d6e0e28b45...HEAD -- Sources/ShogiCoachCore | grep -q .; then
            echo "AUTHORITY MISMATCH: production code changed after Build18-3 freeze" >&2
            git diff --name-only 054f30a54463d472cc96a16c49cd14d6e0e28b45...HEAD -- Sources/ShogiCoachCore >&2
            exit 1
          fi

          python3 - <<'PY'
          import json
          from pathlib import Path

          p = Path("Build18/BUILD18_5A_DECISION_MANIFEST_20261004.json")
          d = json.loads(p.read_text(encoding="utf-8"))
          expected = {
              "respond_to_rapid_attack": "HOLD",
              "sabai": "HOLD",
              "trade_to_transform": "HOLD",
              "multi_threat": "HOLD",
              "tempo_management": "HOLD",
          }
          assert d["decisions"] == expected
          assert d["decisionCounts"]["PROMOTE_TO_LIMITED_EXPLANATION"] == 0
          assert d["decisionCounts"]["HOLD"] == 5
          assert d["build18_5bAllowed"] is False
          assert d["authority"]["corpusSha256"] == "433438a81e94863a08fde83fb4c3659d660390576198df9f3d2e17a58d3b86f0"
          print("build18_5a_authority=PASS")
          PY

          CORPUS="$(find . -type f -name 'BUILD18_2_DIAGNOSTIC_CORPUS_20261002.json' -not -path './Build18/Legacy/*' | head -n 1)"
          test -n "$CORPUS"
          ACTUAL="$(shasum -a 256 "$CORPUS" | awk '{print $1}')"
          test "$ACTUAL" = "433438a81e94863a08fde83fb4c3659d660390576198df9f3d2e17a58d3b86f0"
          printf '%s\n' "$CORPUS" > build/gate-a/corpus-path.txt
          printf '%s\n' "$ACTUAL" > build/gate-a/corpus-sha256.txt
          printf '%s\n' "054f30a54463d472cc96a16c49cd14d6e0e28b45" > build/gate-a/build18-3-freeze-head.txt
          printf '%s\n' "3ef903e5762e695646204987196e8b8fff500155" > build/gate-a/build18-3-production-head.txt
          printf '%s\n' "3443b3cb0830783b325fca4bd82fd374a185dc6a" > build/gate-a/build18-5a-head.txt
          printf '%s\n' "3f298c3c87bf43d40365fb53196d4e5649cb2fa352a592b6d5489f50a69c39c4" > build/gate-a/build18-4v-parent-attested-package-sha256.txt
          echo "AUTHORITY_AUDIT_PASS"

      - name: Fetch official Denryusen KIF fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/build18-6-kif
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://denryu-sen.jp/denryusen/dr4_hardware2/kif_dr4_hdw2.zip' \
            --output build/build18-6-denryusen.zip
          shasum -a 256 build/build18-6-denryusen.zip | tee build/BUILD18_6_SOURCE_ARCHIVE_SHA256.txt
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          source = Path("build/build18-6-denryusen.zip")
          destination = Path("build/build18-6-kif").resolve()
          with zipfile.ZipFile(source, metadata_encoding="cp932") as archive:
              for member in archive.infolist():
                  target = (destination / member.filename).resolve()
                  if destination not in target.parents and target != destination:
                      raise SystemExit(f"unsafe zip path: {member.filename}")
              archive.extractall(destination)
          files = sorted(destination.rglob("*.kif"))
          if len(files) < 10:
              raise SystemExit(f"insufficient KIF files: {len(files)}")
          print(f"kif_files={len(files)}")
          PY

      - name: Gate B — 100-position Pilot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/gate-b
          swift run -c release Build17RealGameRegression -- \
            --input-dir build/build18-6-kif \
            --output-json build/gate-b/real-game.json \
            --output-markdown build/gate-b/real-game.md \
            --target-positions 100 \
            --max-positions-per-game 25 \
            --min-games 4 \
            --max-ply 140 \
            --game-sampling-policy deterministic-hash-v1 \
            --position-sampling-policy evenly-spaced-v1 \
            --source-id 'denryusen:dr4-hardware2:2024' \
            --source-title '第2回マイナビニュース杯電竜戦統一ハードウェア戦' \
            --source-url 'https://denryu-sen.jp/denryusen/dr4_hardware2/dr1_live.php' \
            --rights-note '公式ページ: 棋譜利用は制限等ありませんので、ご自由にお使いください。' \
            --retrieved-date '2026-10-04' \
            2>&1 | tee build/gate-b/run.log
          python3 scripts/build18_6_audit.py \
            --input build/gate-b/real-game.json \
            --output-dir build/gate-b \
            --min-games 4 \
            --min-positions 100 \
            --label pilot

      - name: Gate C — 300-position Mid Audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/gate-c
          swift run -c release Build17RealGameRegression -- \
            --input-dir build/build18-6-kif \
            --output-json build/gate-c/real-game.json \
            --output-markdown build/gate-c/real-game.md \
            --target-positions 300 \
            --max-positions-per-game 30 \
            --min-games 10 \
            --max-ply 140 \
            --game-sampling-policy deterministic-hash-v1 \
            --position-sampling-policy evenly-spaced-v1 \
            --source-id 'denryusen:dr4-hardware2:2024' \
            --source-title '第2回マイナビニュース杯電竜戦統一ハードウェア戦' \
            --source-url 'https://denryu-sen.jp/denryusen/dr4_hardware2/dr1_live.php' \
            --rights-note '公式ページ: 棋譜利用は制限等ありませんので、ご自由にお使いください。' \
            --retrieved-date '2026-10-04' \
            2>&1 | tee build/gate-c/run.log
          python3 scripts/build18_6_audit.py \
            --input build/gate-c/real-game.json \
            --output-dir build/gate-c \
            --min-games 10 \
            --min-positions 300 \
            --label mid

      - name: Gate D — 720-position Full E2E
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/full
          swift run -c release Build17RealGameRegression -- \
            --input-dir build/build18-6-kif \
            --output-json build/full/real-game-raw.json \
            --output-markdown build/full/real-game-raw.md \
            --target-positions 720 \
            --max-positions-per-game 60 \
            --min-games 12 \
            --max-ply 140 \
            --game-sampling-policy deterministic-hash-v1 \
            --position-sampling-policy evenly-spaced-v1 \
            --source-id 'denryusen:dr4-hardware2:2024' \
            --source-title '第2回マイナビニュース杯電竜戦統一ハードウェア戦' \
            --source-url 'https://denryu-sen.jp/denryusen/dr4_hardware2/dr1_live.php' \
            --rights-note '公式ページ: 棋譜利用は制限等ありませんので、ご自由にお使いください。' \
            --retrieved-date '2026-10-04' \
            2>&1 | tee build/full/run.log
          python3 scripts/build18_6_audit.py \
            --input build/full/real-game-raw.json \
            --output-dir build/full \
            --min-games 12 \
            --min-positions 720 \
            --label full

      - name: Gate F — existing regression
        shell: bash
        run: |
          set -euo pipefail
          swift test 2>&1 | tee build/full/swift-test.log
          ./scripts/verify.sh 2>&1 | tee build/full/static-verify.log
          python3 - <<'PY'
          import json
          from pathlib import Path
          raw=json.loads(Path("build/full/real-game-raw.json").read_text(encoding="utf-8"))
          mandatory={x["id"]:x["passed"] for x in raw["summary"]["mandatoryRegressions"]}
          expected={
              "C_build16_r1_ply59_overflow",
              "A_locked_rook_pawn_response",
              "B_bishop_line_multi_concept_priority",
          }
          assert set(mandatory)==expected
          assert all(mandatory.values())
          out={
              "LockedRegression":"PASS",
              "Build16-R1":"PASS",
              "Build17MandatoryRegression":"PASS",
              "Build18-3DedicatedTests":"PASS_VIA_SWIFT_TEST",
              "Build18-2_360_CorpusAuthority":"PASS_VIA_GATE_A_SHA",
              "staticVerify":"PASS",
              "productionCodeChangedAfterBuild18-3Freeze":False,
          }
          Path("build/full/BUILD18_6_REGRESSION_RESULTS_20261004.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          PY

      - name: Package automated evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cp Build18/BUILD18_6_SOURCE_SAMPLING_PLAN_20261004.md build/full/ || true
          cp -R build/gate-a build/full/GATE_A_AUTHORITY || true
          cp build/BUILD18_6_SOURCE_ARCHIVE_SHA256.txt build/full/ || true
          cd build/full
          zip -qr ../BUILD18_6_AUTOMATED_EVIDENCE_20261004.zip .
          shasum -a 256 ../BUILD18_6_AUTOMATED_EVIDENCE_20261004.zip > ../BUILD18_6_AUTOMATED_EVIDENCE_20261004.zip.sha256

      - name: Upload automated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build18-6-automated-evidence
          path: |
            build/gate-a
            build/gate-b
            build/gate-c
            build/full
            build/BUILD18_6_AUTOMATED_EVIDENCE_20261004.zip
            build/BUILD18_6_AUTOMATED_EVIDENCE_20261004.zip.sha256
            build/BUILD18_6_SOURCE_ARCHIVE_SHA256.txt
          if-no-files-found: ignore
          retention-days: 14

  platform-gates:
    needs: real-game-audit
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Prepare iOS dependencies
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v 7z >/dev/null 2>&1 || brew install p7zip
          command -v pod >/dev/null 2>&1 || sudo gem install cocoapods
          ./scripts/fetch_yaneuraou.sh
          ./scripts/patch_yaneuraou_ios.sh
          ./scripts/fetch_eval.sh
          xcodegen generate
          pod install

      - name: iOS Device build
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/platform
          GIT_COMMIT_SHA="$GITHUB_SHA" xcodebuild \
            -workspace ShogiCoachPoC.xcworkspace \
            -scheme ShogiCoachPoC \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath build/device-derived \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build/platform/device-build.log

      - name: iOS Simulator build and E2E
        shell: bash
        run: |
          set -euo pipefail
          GIT_COMMIT_SHA="$GITHUB_SHA" xcodebuild \
            -workspace ShogiCoachPoC.xcworkspace \
            -scheme ShogiCoachPoC \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/sim-derived \
            CODE_SIGNING_ALLOWED=NO \
            build 2>&1 | tee build/platform/simulator-build.log

          UDID="$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin)["devices"]; xs=[x for arr in d.values() for x in arr if x.get("isAvailable") and x.get("name","").startswith("iPhone")]; print(xs[0]["udid"] if xs else "")')"
          test -n "$UDID"
          xcrun simctl boot "$UDID" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$UDID" -b

          APP="$(find build/sim-derived/Build/Products/Debug-iphonesimulator -maxdepth 2 -name 'ShogiCoachPoC.app' | head -n 1)"
          test -d "$APP"
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.inari1234.shogicoachpoc --ci-smoke | tee build/platform/simulator-launch.log

          REPORT=""
          for _ in $(seq 1 180); do
            CONTAINER="$(xcrun simctl get_app_container "$UDID" com.inari1234.shogicoachpoc data 2>/dev/null || true)"
            if [ -n "$CONTAINER" ] && [ -f "$CONTAINER/Documents/ci-probe.txt" ]; then
              cp "$CONTAINER/Documents/ci-probe.txt" build/platform/simulator-ci-probe.txt
              REPORT="build/platform/simulator-ci-probe.txt"
              if grep -q '^stage=complete$' "$REPORT"; then
                break
              fi
            fi
            sleep 2
          done

          test -n "$REPORT"
          cat "$REPORT"
          grep -q '^stage=complete$' "$REPORT"
          grep -q '^context_semantics_status=PASS$' "$REPORT"
          grep -q '^context_explanation_status=PASS$' "$REPORT"
          grep -q '^analysis_quality_gate_status=PASS$' "$REPORT"

          python3 - <<'PY'
          import json
          from pathlib import Path
          report=Path("build/platform/simulator-ci-probe.txt").read_text(encoding="utf-8")
          out={
              "Device":"PASS",
              "Simulator":"PASS",
              "SimulatorE2E":"PASS",
              "stage":"complete" if "stage=complete" in report else "FAIL",
              "context_semantics_status":"PASS" if "context_semantics_status=PASS" in report else "FAIL",
              "context_explanation_status":"PASS" if "context_explanation_status=PASS" in report else "FAIL",
              "analysis_quality_gate_status":"PASS" if "analysis_quality_gate_status=PASS" in report else "FAIL",
          }
          Path("build/platform/BUILD18_6_DEVICE_SIMULATOR_RESULTS_20261004.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2,sort_keys=True)+"\n",encoding="utf-8"
          )
          PY

      - name: Upload platform evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build18-6-platform-evidence
          path: build/platform
          if-no-files-found: ignore
          retention-days: 14
