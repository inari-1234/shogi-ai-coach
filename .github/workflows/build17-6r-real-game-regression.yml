name: Build17-6R Real-game Regression

on:
  push:
    branches:
      - 'candidate/build17-6r-real-game-e2e'
  workflow_dispatch:

concurrency:
  group: build17-6r-real-game-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-game-regression:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch official Denryusen KIF fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/build17-6-kif
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://denryu-sen.jp/denryusen/dr4_hardware2/kif_dr4_hdw2.zip' \
            --output build/build17-6-denryusen.zip
          python3 - <<'PY'
          import zipfile
          from pathlib import Path

          source = Path("build/build17-6-denryusen.zip")
          destination = Path("build/build17-6-kif").resolve()
          with zipfile.ZipFile(source, metadata_encoding="cp932") as archive:
              for member in archive.infolist():
                  target = (destination / member.filename).resolve()
                  if destination not in target.parents and target != destination:
                      raise SystemExit(f"unsafe zip path: {member.filename}")
              archive.extractall(destination)
          print(f"kif_files={len(list(destination.rglob('*.kif')))}")
          PY

      - name: Run Build17-6 real-game audit
        shell: bash
        run: |
          set -o pipefail
          swift run -c release Build17RealGameRegression -- \
            --input-dir build/build17-6-kif \
            --output-json build/Build17-6R_REAL_GAME_AUDIT.json \
            --output-markdown build/Build17-6R_REAL_GAME_AUDIT.md \
            --target-positions 240 \
            --max-positions-per-game 60 \
            --min-games 4 \
            --max-ply 100 \
            --source-id 'denryusen:dr4-hardware2:2024' \
            --source-title '第2回マイナビニュース杯電竜戦統一ハードウェア戦' \
            --source-url 'https://denryu-sen.jp/denryusen/dr4_hardware2/dr1_live.php' \
            --rights-note '公式ページ: 棋譜利用は制限等ありませんので、ご自由にお使いください。' \
            --retrieved-date '2026-10-02' \
            2>&1 | tee build/build17-6r-real-game.log

      - name: Validate audit output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          doc = json.loads(Path("build/Build17-6R_REAL_GAME_AUDIT.json").read_text(encoding="utf-8"))
          s = doc["summary"]
          f = s["frequency"]
          assert doc["schemaVersion"] == 1
          assert s["auditedGames"] >= 4
          assert s["auditedPositions"] >= 240
          assert s["blockingIssueCount"] == 0
          assert f["residualConsecutiveRepeatCount"] == 0
          assert all(item["passed"] for item in s["mandatoryRegressions"])
          assert {item["id"] for item in s["mandatoryRegressions"]} == {
              "C_build16_r1_ply59_overflow",
              "A_locked_rook_pawn_response",
              "B_bishop_line_multi_concept_priority",
          }
          print("build17_6r_output_validation=PASS")
          print("build17_6r_games=", s["auditedGames"])
          print("build17_6r_positions=", s["auditedPositions"])
          print("build17_6r_supplement_rate=", f["supplementRate"])
          print("build17_6r_blocking_issues=", s["blockingIssueCount"])
          PY

      - name: Split semantic audit reports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path("build/Build17-6R_REAL_GAME_AUDIT.json")
          d=json.loads(p.read_text(encoding="utf-8"))
          s=d["summary"]; f=s["frequency"]; records=d["records"]
          def write(name,title,lines):
              Path("build",name).write_text("# "+title+"\n\n"+"\n".join(lines)+"\n",encoding="utf-8")
          issue_records=[r for r in records if r["falseExplanationCategories"]]
          write("Build17-6R_FALSE_EXPLANATION_AUDIT.md","Build17-6R False Explanation Audit",[
              f"- blocking issue count: {s['blockingIssueCount']}",
              f"- affected positions: {len(issue_records)}",
              "",
              *[f"- {r['gameID']} ply {r['ply']}: {','.join(r['falseExplanationCategories'])}" for r in issue_records[:100]]
          ])
          write("Build17-6R_CONCEPT_FREQUENCY_AUDIT.md","Build17-6R Concept Frequency Audit",[
              f"- audited positions: {s['auditedPositions']}",
              f"- supplements: {f['supplementCount']}",
              f"- supplement rate: {f['supplementRate']:.6f}",
              f"- piece_mobility: {f['pieceMobilityCount']}",
              f"- escape_route_control: {f['escapeRouteControlCount']}",
              f"- attack_attacker: {f['attackAttackerCount']}",
              f"- no supplement: {s['auditedPositions']-f['supplementCount']}"
          ])
          write("Build17-6R_REPETITION_AUDIT.md","Build17-6R Repetition Audit",[
              f"- candidate immediate repeats: {f['candidateImmediateRepeatCount']}",
              f"- suppressed immediate repeats: {f['suppressedImmediateRepeatCount']}",
              f"- residual consecutive repeats: {f['residualConsecutiveRepeatCount']}",
              f"- same concept shown within 3 ply: {f['sameConceptShownWithin3PlyCount']}"
          ])
          br=[r for r in records if r["beginnerReadabilityReview"]]
          write("Build17-6R_BEGINNER_READABILITY_AUDIT.md","Build17-6R Beginner Readability Audit",[
              f"- automated review candidates: {s['beginnerReadabilityReviewCandidateCount']}",
              "",
              *[f"- {r['gameID']} ply {r['ply']}: primary={r['primaryExplanation']} / supplement={r['conceptSupplementText'] or '-'}" for r in br[:100]]
          ])
          oe=[r for r in records if r["overExplanationReview"]]
          write("Build17-6R_OVER_EXPLANATION_AUDIT.md","Build17-6R Over-explanation Audit",[
              f"- automated review candidates: {s['overExplanationReviewCandidateCount']}",
              "",
              *[f"- {r['gameID']} ply {r['ply']}: primary={r['primaryExplanation']} / supplement={r['conceptSupplementText'] or '-'}" for r in oe[:100]]
          ])
          PY

      - name: Static diff authority audit
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 0387dd22216627aad13c51754ac9cf4f066f949e...HEAD | sort > build/build17-6r-diff-files.txt
          python3 - <<'PY'
          from pathlib import Path
          files=Path("build/build17-6r-diff-files.txt").read_text().splitlines()
          forbidden=[
            "Sources/ShogiCoachCore/ContextEngine.swift",
            "Sources/ShogiCoachCore/ContextExplanation.swift",
          ]
          hit=[x for x in forbidden if x in files]
          status="PASS" if not hit else "FAIL"
          Path("build/Build17-6R_STATIC_DIFF_AUDIT.md").write_text(
              "# Build17-6R Static Diff Audit\n\n"
              f"- baseline: 0387dd22216627aad13c51754ac9cf4f066f949e\n"
              f"- result: **{status}**\n"
              f"- prohibited production files changed: {len(hit)}\n\n"
              "## Changed files\n\n" + "\n".join(f"- \`{x}\`" for x in files) + "\n",
              encoding="utf-8"
          )
          if hit:
              raise SystemExit("prohibited production diff: "+",".join(hit))
          PY
          printf '%s\n' "${GITHUB_SHA}" > build/Build17-6R_VALIDATION_HEAD.txt

      - name: Swift regression
        shell: bash
        run: |
          set -euo pipefail
          swift test 2>&1 | tee build/swift-test.log
          ./scripts/verify.sh 2>&1 | tee build/static-verify.log

      - name: Upload Build17-6 audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build17-6R-real-game-audit
          path: |
            build/Build17-6R_REAL_GAME_AUDIT.json
            build/Build17-6R_REAL_GAME_AUDIT.md
            build/Build17-6R_FALSE_EXPLANATION_AUDIT.md
            build/Build17-6R_CONCEPT_FREQUENCY_AUDIT.md
            build/Build17-6R_REPETITION_AUDIT.md
            build/Build17-6R_BEGINNER_READABILITY_AUDIT.md
            build/Build17-6R_OVER_EXPLANATION_AUDIT.md
            build/Build17-6R_STATIC_DIFF_AUDIT.md
            build/Build17-6R_VALIDATION_HEAD.txt
            build/build17-6r-diff-files.txt
            build/build17-6r-real-game.log
            build/swift-test.log
            build/static-verify.log
          if-no-files-found: ignore
          retention-days: 14
