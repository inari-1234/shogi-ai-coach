name: TEMP B6 Incomplete Evidence Patch

on:
  push:
    branches:
      - candidate/build19-ve1-b6-incomplete-evidence

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-24.04
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply audited minimal replacements
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one replacement target, found {count}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          probe = r'''import Foundation
          import Darwin
          import ShogiCoachCore

          #if targetEnvironment(simulator)
          @MainActor
          enum B6IncompleteStateSimulatorProbe {
              static let testName = "B6IncompleteStateProductionAbortProbe"
              private static let proofFileName = "b6-incomplete-state-runtime.json"

              static func runIfRequested() async {
                  guard ProcessInfo.processInfo.arguments.contains("--ci-smoke") else { return }
                  do {
                      let game = try KIFParser.parse("""
                      手合割：平手
                      先手：あなた
                      後手：CPU
                      1 ７六歩(77)
                      2 ８四歩(83)
                      3 ２六歩(27)
                      4 ８五歩(84)
                      5 ７七角(88)
                      6 投了
                      """)

                      let shallow = ShallowAnalysisViewModel()
                      await shallow.analyze(
                          game: game,
                          fileName: "b6-incomplete-state-probe.kif",
                          movetimeMs: 80
                      )
                      guard shallow.status == "浅解析 PASS",
                            let diagnosticURL = shallow.diagnosticURL else {
                          throw NSError(
                              domain: "ShogiCoach.B6IncompleteProbe",
                              code: 1,
                              userInfo: [NSLocalizedDescriptionKey: "shallow preparation failed"]
                          )
                      }

                      // Simulator-only fault injection. This does not change the frozen
                      // physical B6 policy. The deliberately huge node targets plus a 1 ms
                      // safety ceiling force the production DeepAnalysisViewModel path to
                      // exercise the real safety-abort/incomplete handling boundary.
                      let abortPolicy = VE1BNodeSearchPolicy(
                          candidateDiscoveryNodes: 50_000_000,
                          candidateDiscoveryNodeTiers: [50_000_000, 100_000_000, 200_000_000],
                          confirmationNodeTiers: [50_000_000, 100_000_000, 200_000_000],
                          safetyCeilingMs: 1,
                          authorityStatus: "SIMULATOR_B6_INCOMPLETE_STATE_PROBE"
                      )
                      try abortPolicy.validate()

                      let deep = DeepAnalysisViewModel()
                      await deep.analyze(
                          game: game,
                          shallowEntries: shallow.entries,
                          diagnosticURL: diagnosticURL,
                          deepMovetimeMs: 800,
                          multiPV: 3,
                          maxPositions: 1,
                          nodePolicy: abortPolicy
                      )

                      guard case .incomplete(_, let completed, let expected) = deep.runState,
                            completed < expected,
                            deep.displayStatus == "深掘り 未完了（\(completed)/\(expected)局面）",
                            deep.entries.isEmpty,
                            let evidenceURL = deep.searchEvidenceURL,
                            FileManager.default.fileExists(atPath: evidenceURL.path) else {
                          throw NSError(
                              domain: "ShogiCoach.B6IncompleteProbe",
                              code: 2,
                              userInfo: [NSLocalizedDescriptionKey: "production incomplete-state/UI suppression contract failed"]
                          )
                      }

                      let evidenceData = try Data(contentsOf: evidenceURL)
                      let decoder = JSONDecoder()
                      decoder.dateDecodingStrategy = .iso8601
                      let evidence = try decoder.decode(VE1BSearchEvidenceDocument.self, from: evidenceData)
                      let completionStates = evidence.incompleteAttempts.map(\.completion)
                      guard !evidence.incompleteAttempts.isEmpty,
                            completionStates.contains("safety_aborted"),
                            completionStates.allSatisfy({
                                $0 != "node_budget_reached" && $0 != "proven_mate_termination"
                            }) else {
                          throw NSError(
                              domain: "ShogiCoach.B6IncompleteProbe",
                              code: 3,
                              userInfo: [NSLocalizedDescriptionKey: "incomplete raw evidence was not preserved as safety_aborted"]
                          )
                      }

                      let payload: [String: Any] = [
                          "schemaVersion": 1,
                          "testName": testName,
                          "runState": "incomplete",
                          "displayStatus": deep.displayStatus,
                          "completedPositions": completed,
                          "expectedPositions": expected,
                          "recommendationSuppressed": deep.entries.isEmpty,
                          "lossSuppressed": deep.entries.allSatisfy { $0.actualLossCp == nil },
                          "evidenceSaved": true,
                          "evidenceFileName": evidenceURL.lastPathComponent,
                          "incompleteAttemptCount": evidence.incompleteAttempts.count,
                          "completionStates": completionStates,
                          "result": "PASS"
                      ]
                      let data = try JSONSerialization.data(
                          withJSONObject: payload,
                          options: [.prettyPrinted, .sortedKeys]
                      )
                      try data.write(to: proofURL, options: .atomic)
                      SimulatorStage.mark("b6_incomplete_state_production_abort_probe_pass")
                  } catch {
                      let payload: [String: Any] = [
                          "schemaVersion": 1,
                          "testName": testName,
                          "result": "FAIL",
                          "error": error.localizedDescription
                      ]
                      if let data = try? JSONSerialization.data(
                          withJSONObject: payload,
                          options: [.prettyPrinted, .sortedKeys]
                      ) {
                          try? data.write(to: proofURL, options: .atomic)
                      }
                      SimulatorStage.mark("b6_incomplete_state_production_abort_probe_fail_\(error.localizedDescription)")
                      fflush(stdout)
                      exit(29)
                  }
              }

              private static var proofURL: URL {
                  FileManager.default.urls(for: .documentDirectory, in: .userDomainMask)[0]
                      .appendingPathComponent(proofFileName)
              }
          }
          #endif
          '''
          # Remove indentation introduced by this workflow heredoc from the Swift source.
          import textwrap
          Path('iOS/ShogiCoachPoC/B6IncompleteStateSimulatorProbe.swift').write_text(
              textwrap.dedent(probe), encoding='utf-8'
          )

          replace(
              'iOS/ShogiCoachPoC/ShogiCoachPoCApp.swift',
              '''                await VE1ASimulatorPreflight.runIfRequested()\n                await VE1BSimulatorCIProbe.runIfRequested()\n                await SimulatorCIProbe.runIfRequested()''',
              '''                await VE1ASimulatorPreflight.runIfRequested()\n                await VE1BSimulatorCIProbe.runIfRequested()\n                await B6IncompleteStateSimulatorProbe.runIfRequested()\n                await SimulatorCIProbe.runIfRequested()'''
          )

          replace(
              'Project.yml',
              '''        GitCommit: "$(GIT_COMMIT_SHA)"\n        UILaunchScreen: {}''',
              '''        GitCommit: "$(GIT_COMMIT_SHA)"\n        B6IncompleteProofRunID: "$(B6_INCOMPLETE_PROOF_RUN_ID)"\n        B6IncompleteProofResult: "$(B6_INCOMPLETE_PROOF_RESULT)"\n        B6IncompleteProofTestName: "$(B6_INCOMPLETE_PROOF_TEST_NAME)"\n        B6IncompleteProofWorkflow: "$(B6_INCOMPLETE_PROOF_WORKFLOW)"\n        UILaunchScreen: {}'''
          )
          replace(
              'Project.yml',
              '''        INFOPLIST_KEY_GitCommit: "$(GIT_COMMIT_SHA)"\n        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES''',
              '''        INFOPLIST_KEY_GitCommit: "$(GIT_COMMIT_SHA)"\n        INFOPLIST_KEY_B6IncompleteProofRunID: "$(B6_INCOMPLETE_PROOF_RUN_ID)"\n        INFOPLIST_KEY_B6IncompleteProofResult: "$(B6_INCOMPLETE_PROOF_RESULT)"\n        INFOPLIST_KEY_B6IncompleteProofTestName: "$(B6_INCOMPLETE_PROOF_TEST_NAME)"\n        INFOPLIST_KEY_B6IncompleteProofWorkflow: "$(B6_INCOMPLETE_PROOF_WORKFLOW)"\n        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES'''
          )

          replace(
              'iOS/ShogiCoachPoC/VE1BPhysicalQualificationView.swift',
              '''    static var thermalState: String {''',
              '''    static var incompleteProofRunID: String {\n        Bundle.main.object(forInfoDictionaryKey: "B6IncompleteProofRunID") as? String ?? "unknown"\n    }\n\n    static var incompleteProofResult: String {\n        Bundle.main.object(forInfoDictionaryKey: "B6IncompleteProofResult") as? String ?? "UNKNOWN"\n    }\n\n    static var incompleteProofTestName: String {\n        Bundle.main.object(forInfoDictionaryKey: "B6IncompleteProofTestName") as? String ?? "unknown"\n    }\n\n    static var incompleteProofWorkflow: String {\n        Bundle.main.object(forInfoDictionaryKey: "B6IncompleteProofWorkflow") as? String ?? "unknown"\n    }\n\n    static var thermalState: String {'''
          )
          replace(
              'iOS/ShogiCoachPoC/VE1BPhysicalQualificationView.swift',
              '''    let deepState: String\n    let deepStatus: String\n    let selectedDeepPlies: [Int]''',
              '''    let deepState: String\n    let deepStatus: String\n    let deepDisplayStatus: String?\n    let selectedDeepPlies: [Int]'''
          )
          replace(
              'iOS/ShogiCoachPoC/VE1BPhysicalQualificationView.swift',
              '''            deepState: deepState,\n            deepStatus: deep.status,\n            selectedDeepPlies: selectedPlies,''',
              '''            deepState: deepState,\n            deepStatus: deep.status,\n            deepDisplayStatus: deep.displayStatus,\n            selectedDeepPlies: selectedPlies,'''
          )
          replace(
              'iOS/ShogiCoachPoC/VE1BPhysicalQualificationView.swift',
              '''            incompleteStateProof: "For this gitCommit, require Core regression + production-path Simulator E2E analysis_quality_gate_status=PASS; any natural physical incomplete case must record safeIncompleteState=true.",''',
              '''            incompleteStateProof: "test=\\(VE1BB6Environment.incompleteProofTestName); workflow=\\(VE1BB6Environment.incompleteProofWorkflow); ciRunID=\\(VE1BB6Environment.incompleteProofRunID); result=\\(VE1BB6Environment.incompleteProofResult); gitCommit=\\(VE1BB6Environment.gitCommit); physicalRunDisplayStatusField=deepDisplayStatus",'''
          )
          replace(
              'iOS/ShogiCoachPoC/VE1BPhysicalQualificationView.swift',
              '''        guard VE1BB6Environment.gitCommit != "unknown",\n              VE1BB6Environment.appVersion != "unknown",\n              VE1BB6Environment.appBuild != "unknown" else {\n            throw EngineUSISession.ProbeError.protocolError("B6 app provenance is incomplete")\n        }\n\n        if let prior = (state.standardRuns + state.stressRuns).first {''',
              '''        guard VE1BB6Environment.gitCommit != "unknown",\n              VE1BB6Environment.appVersion != "unknown",\n              VE1BB6Environment.appBuild != "unknown" else {\n            throw EngineUSISession.ProbeError.protocolError("B6 app provenance is incomplete")\n        }\n        let proofRunID = VE1BB6Environment.incompleteProofRunID\n        guard VE1BB6Environment.incompleteProofResult == "PASS",\n              VE1BB6Environment.incompleteProofTestName == "B6IncompleteStateProductionAbortProbe",\n              VE1BB6Environment.incompleteProofWorkflow == "iOS Simulator E2E",\n              !proofRunID.isEmpty, proofRunID != "unknown",\n              proofRunID.allSatisfy({ $0.isNumber }) else {\n            throw EngineUSISession.ProbeError.protocolError(\n                "B6 incomplete-state Simulator proof is missing or not PASS"\n            )\n        }\n\n        if let prior = (state.standardRuns + state.stressRuns).first {'''
          )

          replace(
              '.github/workflows/ios-simulator.yml',
              '''          HDS_JSON="$CONTAINER/Documents/ci-hds-m.json"\n          if [ -s "$HDS_JSON" ]; then\n            cp "$HDS_JSON" simulator-hds-m.json\n          else\n            echo '{}' > simulator-hds-m.json\n          fi\n          cat simulator-result.txt''',
              '''          HDS_JSON="$CONTAINER/Documents/ci-hds-m.json"\n          if [ -s "$HDS_JSON" ]; then\n            cp "$HDS_JSON" simulator-hds-m.json\n          else\n            echo '{}' > simulator-hds-m.json\n          fi\n          B6_INCOMPLETE_RUNTIME_JSON="$CONTAINER/Documents/b6-incomplete-state-runtime.json"\n          if [ -s "$B6_INCOMPLETE_RUNTIME_JSON" ]; then\n            cp "$B6_INCOMPLETE_RUNTIME_JSON" b6-incomplete-state-runtime.json\n          else\n            echo '{}' > b6-incomplete-state-runtime.json\n          fi\n          cat simulator-result.txt'''
          )
          replace(
              '.github/workflows/ios-simulator.yml',
              '''          grep -Fq "ten_status=実機PASS候補" simulator-result.txt\n          grep -Fq "10/10 completed" simulator-result.txt\n\n          python3 - <<'PY'\n          import json\n          from pathlib import Path\n\n          path = Path("simulator-hds-m.json")''',
              '''          grep -Fq "ten_status=実機PASS候補" simulator-result.txt\n          grep -Fq "10/10 completed" simulator-result.txt\n\n          python3 - <<'PY'\n          import json\n          import os\n          from pathlib import Path\n\n          runtime_path = Path("b6-incomplete-state-runtime.json")\n          runtime = json.loads(runtime_path.read_text(encoding="utf-8"))\n          assert runtime["testName"] == "B6IncompleteStateProductionAbortProbe"\n          assert runtime["result"] == "PASS"\n          assert runtime["runState"] == "incomplete"\n          assert runtime["displayStatus"].startswith("深掘り 未完了（")\n          assert runtime["recommendationSuppressed"] is True\n          assert runtime["lossSuppressed"] is True\n          assert runtime["evidenceSaved"] is True\n          assert runtime["incompleteAttemptCount"] >= 1\n          assert "safety_aborted" in runtime["completionStates"]\n          assert not ({"node_budget_reached", "proven_mate_termination"} & set(runtime["completionStates"]))\n\n          proof = {\n              "schemaVersion": 1,\n              "testName": runtime["testName"],\n              "workflow": "iOS Simulator E2E",\n              "ciRunID": os.environ["GITHUB_RUN_ID"],\n              "ciRunAttempt": os.environ.get("GITHUB_RUN_ATTEMPT", "1"),\n              "gitCommit": os.environ["GITHUB_SHA"],\n              "result": "PASS",\n              "runtimeProof": runtime,\n          }\n          Path("b6-incomplete-state-proof.json").write_text(\n              json.dumps(proof, ensure_ascii=False, indent=2, sort_keys=True) + "\\n",\n              encoding="utf-8",\n          )\n          print(f"b6_incomplete_state_status=PASS run_id={proof['ciRunID']}")\n          PY\n\n          python3 - <<'PY'\n          import json\n          from pathlib import Path\n\n          path = Path("simulator-hds-m.json")'''
          )
          replace(
              '.github/workflows/ios-simulator.yml',
              '''            simulator-hds-m.json\n            build/context-knowledge.json''',
              '''            simulator-hds-m.json\n            b6-incomplete-state-runtime.json\n            b6-incomplete-state-proof.json\n            build/context-knowledge.json'''
          )

          replace(
              '.github/workflows/ios.yml',
              '''permissions:\n  contents: read''',
              '''permissions:\n  contents: read\n  actions: read'''
          )
          gh_token_expr = '$' + '{{ github.token }}'
          old = '''      - name: Generate Xcode project\n        shell: bash\n        run: |\n          set -euo pipefail\n          xcodegen generate\n          pod install\n          test -d ShogiCoachPoC.xcworkspace\n\n      - name: Build unsigned iPhone app'''
          new = f'''      - name: Resolve successful Simulator incomplete-state proof\n        shell: bash\n        env:\n          GH_TOKEN: {gh_token_expr}\n        run: |\n          set -euo pipefail\n          PROOF_RUN_ID=''\n          for _ in $(seq 1 92); do\n            PROOF_RUN_ID=$(gh api \\\n              "/repos/$GITHUB_REPOSITORY/actions/workflows/ios-simulator.yml/runs?head_sha=$GITHUB_SHA&per_page=20" \\\n              --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty')\n            if [ -n "$PROOF_RUN_ID" ]; then\n              break\n            fi\n            sleep 15\n          done\n          test -n "$PROOF_RUN_ID"\n          echo "B6_INCOMPLETE_PROOF_RUN_ID=$PROOF_RUN_ID" >> "$GITHUB_ENV"\n          echo "B6_INCOMPLETE_PROOF_RESULT=PASS" >> "$GITHUB_ENV"\n          echo "B6_INCOMPLETE_PROOF_TEST_NAME=B6IncompleteStateProductionAbortProbe" >> "$GITHUB_ENV"\n          echo "B6_INCOMPLETE_PROOF_WORKFLOW=iOS Simulator E2E" >> "$GITHUB_ENV"\n          echo "b6_incomplete_proof_run_id=$PROOF_RUN_ID"\n\n      - name: Generate Xcode project\n        shell: bash\n        run: |\n          set -euo pipefail\n          xcodegen generate\n          pod install\n          test -d ShogiCoachPoC.xcworkspace\n\n      - name: Build unsigned iPhone app'''
          replace('.github/workflows/ios.yml', old, new)
          replace(
              '.github/workflows/ios.yml',
              '''            GIT_COMMIT_SHA="$GITHUB_SHA" \\\n            CODE_SIGNING_ALLOWED=NO''',
              '''            GIT_COMMIT_SHA="$GITHUB_SHA" \\\n            B6_INCOMPLETE_PROOF_RUN_ID="$B6_INCOMPLETE_PROOF_RUN_ID" \\\n            B6_INCOMPLETE_PROOF_RESULT="$B6_INCOMPLETE_PROOF_RESULT" \\\n            B6_INCOMPLETE_PROOF_TEST_NAME="$B6_INCOMPLETE_PROOF_TEST_NAME" \\\n            B6_INCOMPLETE_PROOF_WORKFLOW="$B6_INCOMPLETE_PROOF_WORKFLOW" \\\n            CODE_SIGNING_ALLOWED=NO'''
          )
          PY

          git rm .github/workflows/tmp-b6-incomplete-evidence-patch.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iOS/ShogiCoachPoC/B6IncompleteStateSimulatorProbe.swift \
                  iOS/ShogiCoachPoC/ShogiCoachPoCApp.swift \
                  iOS/ShogiCoachPoC/VE1BPhysicalQualificationView.swift \
                  Project.yml \
                  .github/workflows/ios-simulator.yml \
                  .github/workflows/ios.yml
          git diff --cached --check
          git commit -m 'Build19 VE1-B: prove incomplete state before physical B6'
          git push origin "HEAD:${GITHUB_REF_NAME}"
