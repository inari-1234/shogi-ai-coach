name: VE1-B Completion State Corrective

on:
  push:
    branches:
      - candidate/build19-ve1-b-implementation
    paths:
      - tools/apply_ve1b_completion_state_corrective.py
      - tools/fix_ve1b_completion_corrective_driver.py
      - .github/workflows/ve1b-completion-state-corrective.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply corrective patch and normalize text
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/fix_ve1b_completion_corrective_driver.py
          python3 tools/apply_ve1b_completion_state_corrective.py
          python3 - <<'PY'
          from pathlib import Path
          for name in [
              'Build19/BUILD19_VE1_B_GENERIC_E2E_MIGRATION_20261010.md',
              'Build19/BUILD19_VE1_B_B6_PREMEASUREMENT_ACCEPTANCE_20261010.md',
          ]:
              p = Path(name)
              p.write_text(p.read_text(encoding='utf-8').rstrip() + '\n', encoding='utf-8')
          PY

      - name: Static syntax and structural contract checks
        shell: bash
        run: |
          set -euxo pipefail
          swiftc -parse \
            iOS/ShogiCoachPoC/DeepAnalysisViewModel.swift \
            iOS/ShogiCoachPoC/ContentView.swift \
            iOS/ShogiCoachPoC/SimulatorCIProbe.swift
          grep -Fq 'enum DeepAnalysisRunState' iOS/ShogiCoachPoC/DeepAnalysisViewModel.swift
          grep -Fq 'case incomplete(reason:' iOS/ShogiCoachPoC/DeepAnalysisViewModel.swift
          grep -Fq 'case error(message:' iOS/ShogiCoachPoC/DeepAnalysisViewModel.swift
          grep -Fq 'deepCompletionNegativeContractPasses' iOS/ShogiCoachPoC/SimulatorCIProbe.swift
          grep -Fq 'presentation.status == .provisional' iOS/ShogiCoachPoC/SimulatorCIProbe.swift
          ! grep -Fq 'actualAnalysisSource.hasPrefix("equal-condition")' iOS/ShogiCoachPoC/SimulatorCIProbe.swift
          python3 - <<'PY'
          from pathlib import Path
          deep = Path('iOS/ShogiCoachPoC/DeepAnalysisViewModel.swift').read_text()
          sim = Path('iOS/ShogiCoachPoC/SimulatorCIProbe.swift').read_text()
          assert '\\\\.' not in sim, 'double-escaped Swift keypath remains'
          assert sim.count('actualAnalysisSource.hasPrefix("node-equal-condition")') >= 3
          assert 'actualLossCp == nil' in sim
          assert 'deepNegativeContractValid' in sim
          assert 'deep_stability_by_ply=' in sim
          assert 'comparison unstable:' in deep and 'comparison unconfirmed:' in deep
          PY

      - name: Core regression
        shell: bash
        run: |
          set -euxo pipefail
          swift test
          ./scripts/verify.sh

      - name: Commit corrective implementation
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            iOS/ShogiCoachPoC/DeepAnalysisViewModel.swift \
            iOS/ShogiCoachPoC/ContentView.swift \
            iOS/ShogiCoachPoC/SimulatorCIProbe.swift \
            Build19/BUILD19_VE1_B_GENERIC_E2E_MIGRATION_20261010.md \
            Build19/BUILD19_VE1_B_B6_PREMEASUREMENT_ACCEPTANCE_20261010.md
          git diff --cached --quiet && { echo 'No implementation diff'; exit 1; }
          git commit -m 'VE1-B: separate completion state from semantic stability'
          git push origin HEAD:candidate/build19-ve1-b-implementation
