name: iOS Simulator Engine PoC

on:
  push:
    branches: [main, candidate/phase3-diagnostic-json, candidate/phase4-important-deep-analysis]
  workflow_dispatch:

concurrency:
  group: ios-simulator-engine-poc-v2
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator-engine-poc:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand socketpair PoC source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          parts = [Path(f"artifacts/poc.part.{i:02d}").read_text() for i in range(4)]
          Path(".ci-poc.zip").write_bytes(base64.b64decode("".join(parts)))
          PY
          unzip -q .ci-poc.zip -d .ci-unpack
          rsync -a .ci-unpack/shogi-ai-coach-poc/ ./
          rm -rf .ci-unpack .ci-poc.zip

          cp ci/Project.yml Project.yml
          cp ci/Podfile Podfile
          cp ci/SimulatorCIProbe.swift iOS/ShogiCoachPoC/SimulatorCIProbe.swift
          cp ci/ContentViewPhase4.swift iOS/ShogiCoachPoC/ContentView.swift
          cp ci/EngineProbeSocketPair.swift iOS/ShogiCoachPoC/EngineProbe.swift
          cp ci/EngineNativeSocketPair.h iOS/ShogiCoachPoC/EngineNative.h
          cp ci/engine_bridge_socketpair.cpp native/bridge/engine_bridge.cpp
          cp ci/engine_bridge_socketpair.h native/bridge/engine_bridge.h

          python3 - <<'PY'
          from pathlib import Path

          pod = Path("native/yaneuraou_engine.podspec")
          text = pod.read_text()
          if "s.homepage" not in text:
              text = text.replace(
                  "  s.summary = 'YaneuraOu V9.00 NNUE engine bridge for the Shogi Coach PoC'\n",
                  "  s.summary = 'YaneuraOu V9.00 NNUE engine bridge for the Shogi Coach PoC'\n"
                  "  s.homepage = 'https://github.com/inari-1234/shogi-ai-coach'\n"
              )
          pod.write_text(text)

          app = Path("iOS/ShogiCoachPoC/ShogiCoachPoCApp.swift")
          app_text = app.read_text()
          app_text = app_text.replace(
              "        WindowGroup { ContentView() }",
              "        WindowGroup { ContentView().task { await SimulatorCIProbe.runIfRequested() } }"
          )
          app.write_text(app_text)
          PY

      - name: Core regression tests
        shell: bash
        run: |
          set -euo pipefail
          swift test 2>&1 | tee swift-test.log

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen p7zip cocoapods

      - name: Fetch pinned YaneuraOu and NNUE
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/fetch_yaneuraou.sh scripts/fetch_eval.sh
          ./scripts/fetch_yaneuraou.sh
          ./scripts/fetch_eval.sh
          test -s iOS/ShogiCoachPoC/eval/nn.bin

          python3 - <<'PY'
          from pathlib import Path
          p = Path("native/third_party/YaneuraOu/source/usi.h")
          text = p.read_text(encoding="utf-8-sig")
          marker = "private:\n\t// 内包している思考エンジン"
          insert = "\n".join([
              "#if !STOCKFISH",
              "    bool mobile_execute_command(const std::string& cmd) { return usi_cmdexec(cmd); }",
              "#endif",
              "",
              "private:",
              "\t// 内包している思考エンジン",
          ])
          if marker not in text:
              raise SystemExit("USIEngine private marker not found")
          text = text.replace(marker, insert, 1)
          p.write_text(text, encoding="utf-8")

          # YaneuraOu V9.00 lowercases USI searchmoves tokens. That is invalid
          # for shogi drop moves (for example G*1b), whose piece letter is
          # case-sensitive. Preserve the token exactly as upstream fixed later.
          usi_cpp = Path("native/third_party/YaneuraOu/source/usi.cpp")
          usi_text = usi_cpp.read_text(encoding="utf-8-sig")
          old = "limits.searchmoves.push_back(to_lower(token));"
          if old not in usi_text:
              raise SystemExit("V9.00 searchmoves lowercase marker not found")
          usi_text = usi_text.replace(old, "limits.searchmoves.push_back(token);", 1)
          if old in usi_text:
              raise SystemExit("searchmoves lowercase patch incomplete")
          usi_cpp.write_text(usi_text, encoding="utf-8")
          PY

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          pod install
          test -d ShogiCoachPoC.xcworkspace

      - name: Build iOS Simulator app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ShogiCoachPoC.xcworkspace \
            -scheme ShogiCoachPoC \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/SimulatorDerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            GIT_COMMIT_SHA="$GITHUB_SHA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee simulator-build.log

      - name: Run simulator engine smoke test
        shell: bash
        run: |
          set -euo pipefail
          APP='build/SimulatorDerivedData/Build/Products/Release-iphonesimulator/ShogiCoachPoC.app'
          test -d "$APP"
          mkdir -p "$APP/eval"
          cp iOS/ShogiCoachPoC/eval/nn.bin "$APP/eval/nn.bin"
          test -s "$APP/eval/nn.bin"

          xcrun simctl list devices available --json > simulator-devices.json
          UDID=$(python3 - <<'PY'
          import json
          data = json.load(open("simulator-devices.json"))
          for devices in data["devices"].values():
              for device in devices:
                  if device.get("isAvailable") and "iPhone" in device.get("name", ""):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator")
          PY
          )
          echo "Simulator UDID=$UDID"

          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.inari1234.shogicoachpoc --ci-smoke 2>&1 | tee simulator-run.log

          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.inari1234.shogicoachpoc data)
          REPORT="$CONTAINER/Documents/ci-probe.txt"
          STAGE="$CONTAINER/Documents/ci-stage.txt"

          COMPLETE=0
          for _ in $(seq 1 75); do
            if [ -s "$REPORT" ] && grep -Fq "stage=complete" "$REPORT"; then
              COMPLETE=1
              break
            fi
            sleep 2
          done

          if [ -s "$REPORT" ]; then cp "$REPORT" simulator-result.txt; else echo "stage=no_report" > simulator-result.txt; fi
          if [ -s "$STAGE" ]; then cp "$STAGE" simulator-stage.txt; else echo "stage=no_stage_file" > simulator-stage.txt; fi
          cat simulator-result.txt
          echo "--- stage trace ---"
          cat simulator-stage.txt

          xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate 'process == "ShogiCoachPoC"' > simulator-system.log 2>&1 || true
          xcrun simctl shutdown "$UDID" 2>/dev/null || true

          test "$COMPLETE" -eq 1
          grep -Fq "kif_status=PASS" simulator-result.txt
          grep -Fq "kif_moves=4" simulator-result.txt
          grep -Fq "shallow_status=PASS" simulator-result.txt
          grep -Fq "shallow_count=4" simulator-result.txt
          grep -Fq "diagnostic_status=PASS" simulator-result.txt
          grep -Fq "diagnostic_positions=4" simulator-result.txt
          grep -Fq "deep_status=深掘り PASS" simulator-result.txt
          grep -Fq "deep_count=3" simulator-result.txt
          grep -Fq "deep_multipv=3" simulator-result.txt
          grep -Fq "deep_diagnostic_schema=2" simulator-result.txt
          grep -Fq "terminal_deep_status=深掘り PASS" simulator-result.txt
          grep -Fq "terminal_deep_ply=81" simulator-result.txt
          grep -Fq "terminal_actual_source=multipv" simulator-result.txt
          grep -Fq "drop_searchmoves_status=PASS" simulator-result.txt
          grep -Fq "default_status=PASS候補" simulator-result.txt
          grep -Fq "bestmove:" simulator-result.txt
          grep -Fq "score:" simulator-result.txt
          grep -Fq "pv:" simulator-result.txt
          grep -Fq "ten_status=実機PASS候補" simulator-result.txt
          grep -Fq "10/10 completed" simulator-result.txt

      - name: Upload simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShogiCoachPoC-Simulator-PoC
          path: |
            swift-test.log
            simulator-build.log
            simulator-run.log
            simulator-result.txt
            simulator-stage.txt
            simulator-system.log
          if-no-files-found: ignore
          retention-days: 7
