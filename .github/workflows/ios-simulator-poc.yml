name: iOS Simulator Engine PoC

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-simulator-engine-poc
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator-engine-poc:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand and patch PoC source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          parts = [Path(f"artifacts/poc.part.{i:02d}").read_text() for i in range(4)]
          Path(".ci-poc.zip").write_bytes(base64.b64decode("".join(parts)))
          PY
          unzip -q .ci-poc.zip -d .ci-unpack
          rsync -a .ci-unpack/shogi-ai-coach-poc/ ./
          rm -rf .ci-unpack .ci-poc.zip
          cp ci/Project.yml Project.yml
          cp ci/Podfile Podfile
          cp ci/SimulatorCIProbe.swift iOS/ShogiCoachPoC/SimulatorCIProbe.swift

          python3 - <<'PY'
          from pathlib import Path

          pod = Path("native/yaneuraou_engine.podspec")
          ps = pod.read_text()
          if "s.homepage" not in ps:
              ps = ps.replace(
                  "  s.summary = 'YaneuraOu V9.00 NNUE engine bridge for the Shogi Coach PoC'\n",
                  "  s.summary = 'YaneuraOu V9.00 NNUE engine bridge for the Shogi Coach PoC'\n"
                  "  s.homepage = 'https://github.com/inari-1234/shogi-ai-coach'\n"
              )
          pod.write_text(ps)

          e = Path("iOS/ShogiCoachPoC/EngineProbe.swift")
          es = e.read_text()

          send_start = es.index("    func send(_ line: String) async throws {")
          send_end = es.index("    func readUntil(", send_start)
          send_block = es[send_start:send_end]
          send_block = send_block.replace(
              "withCheckedThrowingContinuation { continuation in",
              "withCheckedThrowingContinuation { (continuation: CheckedContinuation<Void, Error>) in",
              1
          )
          send_block = send_block.replace(
              "else { continuation.resume() }",
              "else { continuation.resume(returning: ()) }",
              1
          )
          es = es[:send_start] + send_block + es[send_end:]

          old_wait = "\n".join([
              "    func waitUntilConnected(timeoutSeconds: Double) async throws {",
              "        if isConnected { return }",
              "        try await withThrowingTaskGroup(of: Void.self) { group in",
              "            group.addTask { try await self.awaitConnectionReady() }",
              "            group.addTask {",
              "                try await Task.sleep(for: .seconds(timeoutSeconds))",
              "                throw EngineUSISession.ProbeError.connectionFailed",
              "            }",
              "            _ = try await group.next()",
              "            group.cancelAll()",
              "        }",
              "    }",
          ])
          new_wait = "\n".join([
              "    func waitUntilConnected(timeoutSeconds: Double) async throws {",
              "        if isConnected { return }",
              "        try await withCheckedThrowingContinuation { continuation in",
              "            connectedContinuation = continuation",
              "            Task {",
              "                try? await Task.sleep(for: .seconds(timeoutSeconds))",
              "                await self.timeoutConnectionWait()",
              "            }",
              "        }",
              "    }",
              "",
              "    private func timeoutConnectionWait() {",
              "        guard !isConnected, let continuation = connectedContinuation else { return }",
              "        connectedContinuation = nil",
              "        continuation.resume(throwing: EngineUSISession.ProbeError.connectionFailed)",
              "    }",
          ])
          if old_wait not in es:
              raise SystemExit("waitUntilConnected target not found")
          es = es.replace(old_wait, new_wait, 1)

          replacements = [
              (
                  "        let port = try await link.start()",
                  "        let port = try await link.start()\n        SimulatorStage.mark(\"listener_started\")"
              ),
              (
                  "        guard code == 0 else { throw ProbeError.engineStartFailed(code) }",
                  "        guard code == 0 else { throw ProbeError.engineStartFailed(code) }\n        SimulatorStage.mark(\"engine_start_returned\")"
              ),
              (
                  "        try await link.waitUntilConnected(timeoutSeconds: 5)",
                  "        try await link.waitUntilConnected(timeoutSeconds: 5)\n        SimulatorStage.mark(\"connected\")"
              ),
              (
                  "        try await link.send(\"usi\")",
                  "        try await link.send(\"usi\")\n        SimulatorStage.mark(\"usi_sent\")"
              ),
              (
                  "        _ = try await link.readUntil({ $0 == \"usiok\" }, timeoutSeconds: 5, label: \"usiok\")",
                  "        _ = try await link.readUntil({ $0 == \"usiok\" }, timeoutSeconds: 5, label: \"usiok\")\n        SimulatorStage.mark(\"usiok\")"
              ),
              (
                  "        try await link.send(\"isready\")",
                  "        try await link.send(\"isready\")\n        SimulatorStage.mark(\"isready_sent\")"
              ),
              (
                  "        _ = try await link.readUntil({ $0 == \"readyok\" }, timeoutSeconds: 20, label: \"readyok\")",
                  "        _ = try await link.readUntil({ $0 == \"readyok\" }, timeoutSeconds: 20, label: \"readyok\")\n        SimulatorStage.mark(\"readyok\")"
              ),
              (
                  "        try await link.send(\"go movetime \\(max(50, movetimeMs))\")",
                  "        try await link.send(\"go movetime \\(max(50, movetimeMs))\")\n        SimulatorStage.mark(\"go_sent\")"
              ),
              (
                  "        guard let result = finalResult else { throw ProbeError.timeout(\"bestmove\") }",
                  "        guard let result = finalResult else { throw ProbeError.timeout(\"bestmove\") }\n        SimulatorStage.mark(\"bestmove_received\")"
              ),
          ]
          for old, new in replacements:
              if old not in es:
                  raise SystemExit(f"stage target not found: {old}")
              es = es.replace(old, new, 1)
          e.write_text(es)

          app = Path("iOS/ShogiCoachPoC/ShogiCoachPoCApp.swift")
          app_text = app.read_text()
          app_text = app_text.replace(
              "        WindowGroup { ContentView() }",
              "        WindowGroup { ContentView().task { await SimulatorCIProbe.runIfRequested() } }"
          )
          app.write_text(app_text)
          PY

      - name: Core regression tests
        shell: bash
        run: |
          set -euo pipefail
          swift test 2>&1 | tee swift-test.log

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen p7zip cocoapods

      - name: Fetch pinned YaneuraOu and NNUE
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/fetch_yaneuraou.sh scripts/fetch_eval.sh
          ./scripts/fetch_yaneuraou.sh
          ./scripts/fetch_eval.sh
          test -s iOS/ShogiCoachPoC/eval/nn.bin

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          pod install
          test -d ShogiCoachPoC.xcworkspace

      - name: Build iOS Simulator app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ShogiCoachPoC.xcworkspace \
            -scheme ShogiCoachPoC \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/SimulatorDerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee simulator-build.log

      - name: Run simulator engine smoke test
        shell: bash
        run: |
          set -euo pipefail
          APP='build/SimulatorDerivedData/Build/Products/Release-iphonesimulator/ShogiCoachPoC.app'
          test -d "$APP"
          mkdir -p "$APP/eval"
          cp iOS/ShogiCoachPoC/eval/nn.bin "$APP/eval/nn.bin"
          test -s "$APP/eval/nn.bin"

          xcrun simctl list devices available --json > simulator-devices.json
          UDID=$(python3 - <<'PY'
          import json
          data = json.load(open("simulator-devices.json"))
          for devices in data["devices"].values():
              for device in devices:
                  if device.get("isAvailable") and "iPhone" in device.get("name", ""):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator")
          PY
          )
          echo "Simulator UDID=$UDID"

          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.inari1234.shogicoachpoc --ci-smoke 2>&1 | tee simulator-run.log

          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.inari1234.shogicoachpoc data)
          REPORT="$CONTAINER/Documents/ci-probe.txt"
          STAGE="$CONTAINER/Documents/ci-stage.txt"

          COMPLETE=0
          for _ in $(seq 1 45); do
            if [ -s "$REPORT" ] && grep -Fq "stage=complete" "$REPORT"; then
              COMPLETE=1
              break
            fi
            sleep 2
          done

          if [ -s "$REPORT" ]; then cp "$REPORT" simulator-result.txt; else echo "stage=no_report" > simulator-result.txt; fi
          if [ -s "$STAGE" ]; then cp "$STAGE" simulator-stage.txt; else echo "stage=no_stage_file" > simulator-stage.txt; fi
          cat simulator-result.txt
          echo "--- stage trace ---"
          cat simulator-stage.txt

          xcrun simctl spawn "$UDID" log show --last 3m --style compact \
            --predicate 'process == "ShogiCoachPoC"' > simulator-system.log 2>&1 || true
          xcrun simctl shutdown "$UDID" 2>/dev/null || true

          test "$COMPLETE" -eq 1
          grep -Fq "default_status=PASS候補" simulator-result.txt
          grep -Fq "bestmove:" simulator-result.txt
          grep -Fq "score:" simulator-result.txt
          grep -Fq "pv:" simulator-result.txt
          grep -Fq "ten_status=実機PASS候補" simulator-result.txt
          grep -Fq "10/10 completed" simulator-result.txt

      - name: Upload simulator diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShogiCoachPoC-Simulator-PoC
          path: |
            swift-test.log
            simulator-build.log
            simulator-run.log
            simulator-result.txt
            simulator-stage.txt
            simulator-system.log
          if-no-files-found: ignore
          retention-days: 7
