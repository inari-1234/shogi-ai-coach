name: Build19 VR1A Apply Source Fix

on:
  workflow_dispatch:
  push:
    branches:
      - candidate/build19-vr1a-hds-m-validated
    paths:
      - Build19/BUILD19_VR1A_SIMULATOR_FIX.patch
      - .github/workflows/build19-vr1a-apply-source-fix.yml

permissions:
  contents: write

jobs:
  apply-source-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply verified Simulator patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH=Build19/BUILD19_VR1A_SIMULATOR_FIX.patch
          TARGET=iOS/ShogiCoachPoC/SimulatorCIProbe.swift
          if [[ ! -f "$PATCH" ]]; then
            echo "patch already consumed"
            exit 0
          fi
          git apply --check "$PATCH"
          git apply "$PATCH"
          grep -Fq 'makeFrozenHDSSemanticEntries' "$TARGET"
          grep -Fq 'hds_m_live_and_frozen_pass_41_49_69' "$TARGET"
          rm "$PATCH"
          git diff --check

      - name: Commit source-only fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo "no source change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iOS/ShogiCoachPoC/SimulatorCIProbe.swift Build19/BUILD19_VR1A_SIMULATOR_FIX.patch
          git commit -m "Build19-VR1A split live engine and frozen semantic HDS regression"
          git push origin HEAD:${GITHUB_REF_NAME}
