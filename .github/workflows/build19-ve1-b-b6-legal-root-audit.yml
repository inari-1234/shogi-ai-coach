name: Build19 VE1-B B6 Legal Root Audit

on:
  push:
    branches:
      - candidate/build19-ve1-c1-pilot
    paths:
      - "Build19/BUILD19_VE1_B_B6_LEGAL_ROOT_AUDIT_INPUT_20261015.json"
      - "native/bridge/engine_bridge.cpp"
      - "iOS/ShogiCoachPoC/VE1BB6LegalRootAuditProbe.swift"
      - "iOS/ShogiCoachPoC/ShogiCoachPoCApp.swift"
      - ".github/workflows/build19-ve1-b-b6-legal-root-audit.yml"

permissions:
  contents: read

jobs:
  b6-legal-root-audit:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Verify frozen audit input
        shell: bash
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "x86_64"
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('Build19/BUILD19_VE1_B_B6_LEGAL_ROOT_AUDIT_INPUT_20261015.json')
          d=json.loads(p.read_text())
          expected=d.pop('input_sha256')
          actual=hashlib.sha256(json.dumps(d,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert actual==expected, (actual, expected)
          assert d['authority_base']=='8daf78caa2bd5919cc911da21bae80fa3d12a248'
          assert d['unique_position_count']==9
          assert d['standard_attempt_count']==315
          assert d['stress_attempt_count']==189
          assert d['total_attempt_count']==504
          assert sum(x['total_attempt_count'] for x in d['positions'])==504
          print('B6 legal-root audit input integrity: PASS')
          PY
          swift test
          ./scripts/verify.sh

      - name: Restore engine assets
        uses: actions/cache@v4
        with:
          path: |
            native/third_party/YaneuraOu
            iOS/ShogiCoachPoC/eval/nn.bin
          key: shogi-engine-assets-v2-intel

      - name: Prepare pinned engine
        shell: bash
        run: |
          set -euxo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v pod >/dev/null 2>&1 || brew install cocoapods
          if [ ! -s iOS/ShogiCoachPoC/eval/nn.bin ]; then
            command -v 7z >/dev/null 2>&1 || brew install p7zip
          fi
          chmod +x scripts/*.sh
          ./scripts/fetch_yaneuraou.sh
          ./scripts/fetch_eval.sh
          ./scripts/patch_yaneuraou_ios.sh
          test "$(shasum -a 256 iOS/ShogiCoachPoC/eval/nn.bin | awk '{print $1}')" = \
            "768068f0d534a0603a5d38bcd143de6bbca820d5f1c95a14d40863e5b7892d76"

      - name: Build x86_64 audit app
        shell: bash
        run: |
          set -euxo pipefail
          xcodegen generate
          pod install
          xcodebuild \
            -workspace ShogiCoachPoC.xcworkspace \
            -scheme ShogiCoachPoC \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/VE1BB6LegalAuditDerivedData \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            GIT_COMMIT_SHA="$GITHUB_SHA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Count YaneuraOu LEGAL root moves for frozen B6 evidence
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/ve1b-b6-legal-root-audit
          APP='build/VE1BB6LegalAuditDerivedData/Build/Products/Release-iphonesimulator/ShogiCoachPoC.app'
          xcrun simctl list devices available --json > build/ve1b-b6-legal-root-audit/devices.json
          UDID=$(python3 - <<'PY'
          import json
          data=json.load(open('build/ve1b-b6-legal-root-audit/devices.json'))
          for devices in data['devices'].values():
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device.get('name',''):
                      print(device['udid'])
                      raise SystemExit(0)
          raise SystemExit('No available iPhone simulator')
          PY
          )
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.inari1234.shogicoachpoc data)
          cp Build19/BUILD19_VE1_B_B6_LEGAL_ROOT_AUDIT_INPUT_20261015.json \
            "$CONTAINER/Documents/ve1b-b6-legal-root-audit-input.json"
          xcrun simctl launch "$UDID" com.inari1234.shogicoachpoc --ci-ve1b-b6-legal-root-audit \
            2>&1 | tee build/ve1b-b6-legal-root-audit/launch.log
          OUT="$CONTAINER/Documents/ve1b-b6-legal-root-audit.json"
          ERR="$CONTAINER/Documents/ve1b-b6-legal-root-audit-error.txt"
          DONE=0
          for _ in $(seq 1 60); do
            if [ -s "$OUT" ]; then DONE=1; break; fi
            if [ -s "$ERR" ]; then cat "$ERR"; break; fi
            sleep 1
          done
          if [ -s "$ERR" ]; then cp "$ERR" build/ve1b-b6-legal-root-audit/error.txt; else : > build/ve1b-b6-legal-root-audit/error.txt; fi
          test "$DONE" -eq 1
          cp "$OUT" build/ve1b-b6-legal-root-audit/report.json
          xcrun simctl shutdown "$UDID" 2>/dev/null || true

      - name: Gate zero B6 impact
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('build/ve1b-b6-legal-root-audit/report.json').read_text())
          assert d['status']=='PASS', d
          assert d['rootMoveGenerator']=='YaneuraOu MoveList<LEGAL>'
          assert d['uniquePositionCount']==9
          assert d['standardAttemptCount']==315
          assert d['stressAttemptCount']==189
          assert d['totalAttemptCount']==504
          assert d['affectedStandardAttemptCount']==0
          assert d['affectedStressAttemptCount']==0
          assert d['affectedTotalAttemptCount']==0
          assert d['minimumLegalRootMoveCount'] >= 3
          assert all(x['legalRootMoveCount'] >= 3 for x in d['positions'])
          print('B6 legal-root scope audit: PASS')
          print('minimumLegalRootMoveCount=', d['minimumLegalRootMoveCount'])
          PY

      - name: Upload B6 legal-root audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build19-VE1-B-B6-legal-root-audit
          path: build/ve1b-b6-legal-root-audit
          if-no-files-found: error
          retention-days: 30
