name: Build19 VE1-B B6 Legal Root Audit

on:
  push:
    branches:
      - candidate/build19-ve1-c1-pilot
    paths:
      - "Build19/BUILD19_VE1_B_B6_LEGAL_ROOT_AUDIT_INPUT_20261015.json"
      - "Sources/ShogiCoachCore/YaneuraOuLegalMoveSemantics.swift"
      - "Sources/VE1BLegalRootCrosscheck/main.swift"
      - "Tests/ShogiCoachCoreTests/YaneuraOuLegalMoveSemanticsTests.swift"
      - "Package.swift"
      - "scripts/fetch_yaneuraou.sh"
      - "scripts/patch_yaneuraou_legal_audit.sh"
      - "tools/engine-verify/yaneuraou_ve1b_legal_audit.inc"
      - "tools/engine-verify/ve1b_b6_legal_root_audit.py"
      - ".github/workflows/build19-ve1-b-b6-legal-root-audit.yml"

permissions:
  contents: read

jobs:
  b6-legal-root-audit:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Verify audit code and frozen input
        shell: bash
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "x86_64"
          python3 -m py_compile tools/engine-verify/ve1b_b6_legal_root_audit.py
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          p=Path('Build19/BUILD19_VE1_B_B6_LEGAL_ROOT_AUDIT_INPUT_20261015.json')
          d=json.loads(p.read_text())
          expected=d.pop('input_sha256')
          actual=hashlib.sha256(json.dumps(d,ensure_ascii=False,sort_keys=True,separators=(',',':')).encode()).hexdigest()
          assert actual==expected, (actual, expected)
          assert d['authority_base']=='8daf78caa2bd5919cc911da21bae80fa3d12a248'
          assert d['unique_position_count']==9
          assert d['standard_attempt_count']==315
          assert d['stress_attempt_count']==189
          assert d['total_attempt_count']==504
          assert sum(x['total_attempt_count'] for x in d['positions'])==504
          print('B6 legal-root audit input integrity: PASS')
          PY
          swift test
          bash scripts/verify.sh

      - name: Prepare pinned native YaneuraOu audit engine
        shell: bash
        run: |
          set -euxo pipefail
          bash scripts/fetch_yaneuraou.sh
          test "$(git -C native/third_party/YaneuraOu rev-parse HEAD)" = \
            "a5ee2786c0030edc7d4a1cdfe94b04dffec55493"
          bash scripts/patch_yaneuraou_legal_audit.sh
          make -C native/third_party/YaneuraOu/source clean TARGET_CPU=APPLEAVX2
          make -C native/third_party/YaneuraOu/source -j2 normal TARGET_CPU=APPLEAVX2 COMPILER=clang++
          test -x native/third_party/YaneuraOu/source/YaneuraOu-by-gcc

      - name: Count B6 roots with engine MoveList LEGAL
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/ve1b-b6-legal-root-audit
          python3 tools/engine-verify/ve1b_b6_legal_root_audit.py \
            --engine native/third_party/YaneuraOu/source/YaneuraOu-by-gcc \
            --input Build19/BUILD19_VE1_B_B6_LEGAL_ROOT_AUDIT_INPUT_20261015.json \
            --output build/ve1b-b6-legal-root-audit/native-report.json \
            --transcript build/ve1b-b6-legal-root-audit/native-transcript.txt

      - name: Crosscheck LEGAL with Swift reconstruction from LEGAL ALL
        shell: bash
        run: |
          set -euxo pipefail
          swift run -c release VE1BLegalRootCrosscheck \
            build/ve1b-b6-legal-root-audit/native-report.json \
            build/ve1b-b6-legal-root-audit/swift-crosscheck.json

      - name: Gate zero B6 impact and exact parity
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          native=json.loads(Path('build/ve1b-b6-legal-root-audit/native-report.json').read_text())
          cross=json.loads(Path('build/ve1b-b6-legal-root-audit/swift-crosscheck.json').read_text())

          assert native['status']=='PASS', native
          assert native['authorityBase']=='8daf78caa2bd5919cc911da21bae80fa3d12a248'
          assert native['engineCommit']=='a5ee2786c0030edc7d4a1cdfe94b04dffec55493'
          assert native['rootMoveGenerator']=='YaneuraOu MoveList<LEGAL>'
          assert native['crosscheckUniverse']=='YaneuraOu MoveList<LEGAL_ALL>'
          assert native['uniquePositionCount']==9
          assert native['standardAttemptCount']==315
          assert native['stressAttemptCount']==189
          assert native['totalAttemptCount']==504
          assert native['affectedStandardAttemptCount']==0
          assert native['affectedStressAttemptCount']==0
          assert native['affectedTotalAttemptCount']==0
          assert native['minimumLegalRootMoveCount'] >= 3
          assert sum(x['totalAttemptCount'] for x in native['positions']) == 504
          assert all(x['legalRootMoveCount'] >= 3 for x in native['positions'])

          assert cross['status']=='PASS', cross
          assert cross['uniquePositionCount']==9
          assert cross['standardAttemptCount']==315
          assert cross['stressAttemptCount']==189
          assert cross['totalAttemptCount']==504
          assert cross['parityMismatchCount']==0
          assert cross['affectedTotalAttemptCount']==0
          assert cross['minimumLegalRootMoveCount'] >= 3
          assert sum(x['totalAttemptCount'] for x in cross['positions']) == 504
          assert all(x['parity'] for x in cross['positions'])
          assert all(x['engineLegalRootMoveCount'] >= 3 for x in cross['positions'])

          print('B6 legal-root scope audit: PASS')
          print('minimumLegalRootMoveCount=', native['minimumLegalRootMoveCount'])
          print('parityMismatchCount=', cross['parityMismatchCount'])
          PY

      - name: Upload B6 legal-root audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build19-VE1-B-B6-legal-root-audit
          path: build/ve1b-b6-legal-root-audit
          if-no-files-found: error
          retention-days: 30
