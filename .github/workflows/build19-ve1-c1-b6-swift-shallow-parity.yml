name: Build19 VE1-C1 B6 Swift Shallow Parity

on:
  push:
    branches:
      - candidate/build19-ve1-c1-pilot
    paths:
      - "iOS/ShogiCoachPoC/VE1C1B6ShallowParityProbe.swift"
      - "iOS/ShogiCoachPoC/ShogiCoachPoCApp.swift"
      - "iOS/ShogiCoachPoC/ShallowAnalysisViewModel.swift"
      - "iOS/ShogiCoachPoC/EngineUSISession.swift"
      - "Sources/ShogiCoachCore/USICompletedIterationSelector.swift"
      - "Sources/ShogiCoachCore/USIParser.swift"
      - "tools/engine-verify/fixtures/ve1c1_b6_shallow_physical_digest.json"
      - "tools/engine-verify/ve1c1_b6_swift_shallow_compare.py"
      - ".github/workflows/build19-ve1-c1-b6-swift-shallow-parity.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  b6-swift-shallow-parity:
    runs-on: macos-15-intel
    timeout-minutes: 30
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Assert x86 host and run core regression
        shell: bash
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "x86_64"
          swift test
          ./scripts/verify.sh
          python3 -m py_compile tools/engine-verify/ve1c1_b6_swift_shallow_compare.py

      - name: Restore engine assets
        uses: actions/cache@v4
        with:
          path: |
            native/third_party/YaneuraOu
            iOS/ShogiCoachPoC/eval/nn.bin
          key: shogi-engine-assets-v2-intel

      - name: Install build tools
        shell: bash
        run: |
          set -euxo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v pod >/dev/null 2>&1 || brew install cocoapods
          if [ ! -s iOS/ShogiCoachPoC/eval/nn.bin ]; then
            command -v 7z >/dev/null 2>&1 || brew install p7zip
          fi

      - name: Prepare frozen iOS engine
        shell: bash
        run: |
          set -euxo pipefail
          chmod +x scripts/*.sh
          ./scripts/fetch_yaneuraou.sh
          ./scripts/fetch_eval.sh
          ./scripts/patch_yaneuraou_ios.sh
          test -s iOS/ShogiCoachPoC/eval/nn.bin
          test "$(shasum -a 256 iOS/ShogiCoachPoC/eval/nn.bin | awk '{print $1}')" = "768068f0d534a0603a5d38bcd143de6bbca820d5f1c95a14d40863e5b7892d76"

      - name: Build x86_64 Simulator app
        shell: bash
        run: |
          set -euxo pipefail
          xcodegen generate
          pod install
          xcodebuild \
            -workspace ShogiCoachPoC.xcworkspace \
            -scheme ShogiCoachPoC \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/VE1C1B6IntelDerivedData \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            GIT_COMMIT_SHA="$GITHUB_SHA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Run actual production ShallowAnalysisViewModel on Intel Simulator
        shell: bash
        run: |
          set -euxo pipefail
          APP='build/VE1C1B6IntelDerivedData/Build/Products/Release-iphonesimulator/ShogiCoachPoC.app'
          test -d "$APP"
          test -s "$APP/eval/nn.bin"

          xcrun simctl list devices available --json > ve1c1-b6-intel-devices.json
          UDID=$(python3 - <<'PY'
          import json
          data=json.load(open('ve1c1-b6-intel-devices.json'))
          for devices in data['devices'].values():
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device.get('name',''):
                      print(device['udid'])
                      raise SystemExit(0)
          raise SystemExit('No available iPhone simulator')
          PY
          )
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.inari1234.shogicoachpoc data)
          mkdir -p "$CONTAINER/Documents"
          cp tools/engine-verify/fixtures/ve1c1_b6_shallow_physical_digest.json \
            "$CONTAINER/Documents/ve1c1_b6_shallow_physical_digest.json"

          xcrun simctl launch "$UDID" com.inari1234.shogicoachpoc --ci-ve1c1-b6-shallow-parity \
            2>&1 | tee ve1c1-b6-swift-launch.log

          OUT="$CONTAINER/Documents/ve1c1-b6-swift-shallow-output.json"
          ERR="$CONTAINER/Documents/ve1c1-b6-swift-shallow-error.txt"
          STAGE="$CONTAINER/Documents/ci-stage.txt"
          DONE=0
          for _ in $(seq 1 180); do
            if [ -s "$OUT" ]; then DONE=1; break; fi
            if [ -s "$ERR" ]; then cat "$ERR"; break; fi
            sleep 2
          done
          if [ -s "$STAGE" ]; then cp "$STAGE" ve1c1-b6-swift-stage.txt; else echo 'no-stage' > ve1c1-b6-swift-stage.txt; fi
          if [ -s "$ERR" ]; then cp "$ERR" ve1c1-b6-swift-error.txt; else : > ve1c1-b6-swift-error.txt; fi
          test "$DONE" -eq 1
          cp "$OUT" ve1c1-b6-swift-shallow-output.json
          xcrun simctl shutdown "$UDID" 2>/dev/null || true

      - name: Compare Swift production output with physical iPhone Authority
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/engine-verify/ve1c1_b6_swift_shallow_compare.py \
            --fixture tools/engine-verify/fixtures/ve1c1_b6_shallow_physical_digest.json \
            --actual ve1c1-b6-swift-shallow-output.json \
            --output ve1c1-b6-swift-shallow-parity-result.json
          python3 - <<'PY'
          import json
          d=json.load(open('ve1c1-b6-swift-shallow-parity-result.json'))
          assert d['status']=='PASS'
          assert d['architecture']=='x86_64'
          assert d['matched_positions']==81
          assert d['mismatch_count']==0
          print('ve1c1_b6_swift_shallow_parity=PASS')
          PY

      - name: Upload production shallow parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build19-VE1-C1-b6-swift-shallow-parity
          path: |
            ve1c1-b6-swift-shallow-output.json
            ve1c1-b6-swift-shallow-parity-result.json
            ve1c1-b6-swift-stage.txt
            ve1c1-b6-swift-error.txt
            ve1c1-b6-swift-launch.log
            ve1c1-b6-intel-devices.json
          if-no-files-found: warn
          retention-days: 30
