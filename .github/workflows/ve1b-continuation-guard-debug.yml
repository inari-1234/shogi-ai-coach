name: VE1-B Continuation Guard Debug

on:
  push:
    branches:
      - candidate/verify-ve1b-continuation-guard

permissions:
  contents: write

jobs:
  instrument:
    if: ${{ !contains(github.event.head_commit.message, '[guard-debug]') }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/verify-ve1b-continuation-guard
          fetch-depth: 0

      - name: Instrument continuation composite guard
        run: |
          set -euo pipefail
          python3 scripts/instrument_continuation_guard.py
          git diff --check

      - name: Commit diagnostics only
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iOS/ShogiCoachPoC/SimulatorCIProbe.swift
          git commit -m '[guard-debug] Instrument VE1-B continuation composite guard'
          git push origin HEAD:candidate/verify-ve1b-continuation-guard
