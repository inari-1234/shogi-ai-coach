name: iOS Device Build

on:
  push:
    branches:
      - main
      - 'candidate/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ios-device-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore engine assets
        uses: actions/cache@v4
        with:
          path: |
            native/third_party/YaneuraOu
            iOS/ShogiCoachPoC/eval/nn.bin
          key: shogi-engine-assets-v2

      - name: Core regression tests
        shell: bash
        run: |
          set -euo pipefail
          swift test 2>&1 | tee swift-test.log
          ./scripts/verify.sh

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v pod >/dev/null 2>&1 || brew install cocoapods
          if [ ! -s iOS/ShogiCoachPoC/eval/nn.bin ]; then
            command -v 7z >/dev/null 2>&1 || brew install p7zip
          fi

      - name: Prepare pinned engine
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/fetch_yaneuraou.sh
          ./scripts/fetch_eval.sh
          ./scripts/patch_yaneuraou_ios.sh
          test -s iOS/ShogiCoachPoC/eval/nn.bin

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          pod install
          test -d ShogiCoachPoC.xcworkspace

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ShogiCoachPoC.xcworkspace \
            -scheme ShogiCoachPoC \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            GIT_COMMIT_SHA="$GITHUB_SHA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log

          if grep -q -- '-DUSE_NEON' xcodebuild.log; then
            echo "Unexpected USE_NEON in real-device build"
            exit 1
          fi

      - name: Verify and package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP='build/DerivedData/Build/Products/Release-iphoneos/ShogiCoachPoC.app'
          test -d "$APP"
          test -x "$APP/ShogiCoachPoC"
          test -s "$APP/eval/nn.bin"
          if [ -f iOS/ShogiCoachPoC/Resources/context-knowledge.json ]; then
            test -s "$APP/context-knowledge.json"
          fi
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../ShogiCoachPoC-unsigned.ipa Payload)
          shasum -a 256 ShogiCoachPoC-unsigned.ipa | tee ipa-sha256.txt
          du -h ShogiCoachPoC-unsigned.ipa

      - name: Upload IPA and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShogiCoachPoC-iPhone
          path: |
            ShogiCoachPoC-unsigned.ipa
            ipa-sha256.txt
            swift-test.log
            xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7

  build18-6-real-game-audit:
    if: github.ref_name == 'candidate/build18-6-real-game-e2e' || github.head_ref == 'candidate/build18-6-real-game-e2e'
    runs-on: macos-15
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Build18-6 staged real-game audit
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/run_build18_6_ci.sh
          ./scripts/run_build18_6_ci.sh

      - name: Upload Build18-6 automated evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build18-6-automated-evidence
          path: |
            build/build18-6
          if-no-files-found: ignore
          retention-days: 14
