name: Build17-4 Safe Concept CI

on:
  push:
    branches:
      - candidate/build17-4-safe-concept-integration
  pull_request:
    branches:
      - candidate/build17-3-pilot-corpus

jobs:
  swift-test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Swift version
        run: swift --version
      - name: Run Swift package tests
        run: swift test
