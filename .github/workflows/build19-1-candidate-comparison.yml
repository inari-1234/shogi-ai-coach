name: Build19-1 Candidate Comparison Core

on:
  push:
    branches:
      - 'candidate/build19-1-candidate-comparison-core'
  workflow_dispatch:

concurrency:
  group: build19-1-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Authority and scope guard
        shell: bash
        run: |
          set -euo pipefail
          BASE=c1316508fad4c5bd2fa9e8728bcee42cba7d0d73
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --exit-code "$BASE"...HEAD -- \
            Sources/ShogiCoachCore/ContextEngine.swift \
            Sources/ShogiCoachCore/ContextExplanation.swift \
            Sources/ShogiCoachCore/GroundedExplanationContext.swift \
            Build18
          changed="$(git diff --name-only "$BASE"...HEAD -- Sources/ShogiCoachCore)"
          unexpected="$(printf '%s\n' "$changed" | grep -v -E '^Sources/ShogiCoachCore/(CandidateComparisonTypes|CandidateAnalysisResolver|CandidateComparisonResolver|CandidateComparisonResolverDefaults|CandidateComparisonDiagnostic|BoardTacticalMetricResolver)\.swift$' | sed '/^$/d' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected production-core change:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('Build18/BUILD18_5A_DECISION_MANIFEST_20261004.json').read_text())
          expected={
            'respond_to_rapid_attack':'HOLD',
            'sabai':'HOLD',
            'trade_to_transform':'HOLD',
            'multi_threat':'HOLD',
            'tempo_management':'HOLD',
          }
          assert d['decisions'] == expected
          print('authority_scope_guard=PASS')
          PY

      - name: Requirement fixture contract coverage
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin candidate/build19-p-gap-audit:refs/remotes/origin/candidate/build19-p-gap-audit
          git show origin/candidate/build19-p-gap-audit:Build19/BUILD19_P_REAL_GAME_GAP_SAMPLES_20261005.json > /tmp/build19p-gap.json
          python3 - <<'PY' | tee build19-1-fixtures.log
          import json
          from collections import Counter
          from pathlib import Path

          source=json.loads(Path('/tmp/build19p-gap.json').read_text())
          result=json.loads(Path('Build19/BUILD19_1_REAL_GAME_FIXTURE_RESULTS_20261005.json').read_text())

          assert source['authority']['mainHead'] == 'c1316508fad4c5bd2fa9e8728bcee42cba7d0d73'
          assert source['sampleCount'] == 30
          assert result['validationMode'] == 'REQUIREMENT_CONTRACT_COVERAGE_NOT_EXPECTED_OUTPUT_LABELING'
          assert result['policy']['planningLabelsAreRequirementsNotTruthLabels'] is True
          assert result['policy']['alternativeCandidateInvented'] is False
          assert result['summary']['fixtures'] == 30
          assert result['summary']['covered'] == 30
          assert result['summary']['criticalDefects'] == 0
          assert len(result['records']) == 30

          by_id={r['id']:r for r in result['records']}
          assert len(by_id) == 30
          for sample in source['samples']:
              r=by_id[sample['id']]
              assert r['src'] == sample['src']
              assert r['phase'] == sample['phase']
              assert r['confidence'] == sample['confidence']
              assert r['trigger'] == sample['trigger']
              assert r['profile'] == sample['evidenceProfile']
              assert r['coverage'] == 'PASS'

          expected_profiles={'BASE_PAIR':12,'PREVIOUS_REPLY':7,'EXCHANGE':6,'FORCING':5}
          assert Counter(s['evidenceProfile'] for s in source['samples']) == Counter(expected_profiles)
          assert set(result['profileCoverage']) == set(expected_profiles)
          assert set(source['summary']['phase']) == {'ENDGAME','OPENING','MIDDLEGAME'}
          assert set(source['summary']['confidence']) == {'low','unresolved','medium','high'}
          assert set(source['summary']['whyNowTrigger']) == {'NONE_IDENTIFIED','DIRECT_PREVIOUS_MOVE','EXCHANGE_SEQUENCE','FORCING_TACTIC'}
          print('requirement_fixture_contract_coverage=PASS')
          print('fixtures=30 covered=30 critical_defects=0')
          print('policy=requirement_source_not_truth_labels')
          PY

      - name: Dedicated comparison tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --filter CandidateComparison 2>&1 | tee build19-1-tests.log

      - name: Build18 protected regression
        shell: bash
        run: |
          set -euo pipefail
          swift test --filter Build17SafeConcept 2>&1 | tee build17-safe.log
          swift test --filter Build18GroundedWhyNowTests 2>&1 | tee build18-whynow.log
          swift test --filter Build18FrozenCorpusProjectionTests 2>&1 | tee build18-frozen-corpus.log

      - name: Full Swift regression and static verify
        shell: bash
        run: |
          set -euo pipefail
          swift test 2>&1 | tee swift-test-full.log
          ./scripts/verify.sh 2>&1 | tee static-verify.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build19-1-validation-logs
          path: |
            build19-1-fixtures.log
            build19-1-tests.log
            build17-safe.log
            build18-whynow.log
            build18-frozen-corpus.log
            swift-test-full.log
            static-verify.log
          if-no-files-found: ignore
          retention-days: 14
