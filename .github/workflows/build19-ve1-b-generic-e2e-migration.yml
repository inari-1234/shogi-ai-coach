name: Build19 VE1-B Generic E2E Migration

on:
  push:
    branches:
      - candidate/build19-ve1-b-implementation
    paths:
      - .github/workflows/build19-ve1-b-generic-e2e-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct residual generic E2E diagnostic authority
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('iOS/ShogiCoachPoC/SimulatorCIProbe.swift')
          text = path.read_text()
          old = 'deepDiagnostic.deepAnalysis?.adaptivePolicy == "adaptive-v2"'
          new = 'deepDiagnostic.deepAnalysis?.adaptivePolicy == "ve1b-node-UNFROZEN_CALIBRATION"'
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'expected exactly one stale adaptive policy assertion, got {count}')
          path.write_text(text.replace(old, new, 1))
          PY

      - name: Verify diagnostic authority replacement
        run: |
          grep -F 'deepDiagnostic.deepAnalysis?.adaptivePolicy == "ve1b-node-UNFROZEN_CALIBRATION"' iOS/ShogiCoachPoC/SimulatorCIProbe.swift
          if grep -F 'deepDiagnostic.deepAnalysis?.adaptivePolicy == "adaptive-v2"' iOS/ShogiCoachPoC/SimulatorCIProbe.swift; then
            echo "Stale adaptive-v2 diagnostic assertion remains" >&2
            exit 1
          fi

      - name: Verify legacy production analyzer is absent
        run: |
          if grep -R "AdaptiveComparisonAnalyzer\.analyze(" iOS/ShogiCoachPoC \
            --include='*.swift' \
            --exclude='AdaptiveComparisonAnalyzer.swift'; then
            echo "Legacy production analyzer call remains" >&2
            exit 1
          fi

      - name: Swift regression
        run: swift test

      - name: Commit corrective migration
        run: |
          if git diff --quiet; then
            echo "No corrective migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iOS/ShogiCoachPoC/SimulatorCIProbe.swift
          git commit -m "VE1-B: fix residual generic E2E diagnostic authority"
          git push origin HEAD:candidate/build19-ve1-b-implementation
