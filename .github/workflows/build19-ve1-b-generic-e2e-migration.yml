name: Build19 VE1-B Generic E2E Migration

on:
  push:
    branches:
      - candidate/build19-ve1-b-implementation
    paths:
      - .github/workflows/build19-ve1-b-generic-e2e-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Correct residual generic E2E diagnostic contract
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('iOS/ShogiCoachPoC/SimulatorCIProbe.swift')
          text = path.read_text()
          old_policy = 'deepDiagnostic.deepAnalysis?.adaptivePolicy == "adaptive-v2"'
          new_policy = 'deepDiagnostic.deepAnalysis?.adaptivePolicy == "ve1b-node-UNFROZEN_CALIBRATION"'
          if text.count(old_policy) != 1:
              raise SystemExit(f'expected one stale adaptive policy assertion, got {text.count(old_policy)}')
          text = text.replace(old_policy, new_policy, 1)
          block_old = '''deepDiagnostic.deepAnalysis?.positions.allSatisfy({
                  $0.actualAnalysisSource.hasPrefix("equal-condition")
                      && !$0.bestPV.isEmpty
                      && !$0.actualPV.isEmpty
                      && $0.analysisAttempts >= 1
              }) == true'''
          block_new = '''deepDiagnostic.deepAnalysis?.positions.allSatisfy({
                  $0.actualAnalysisSource.hasPrefix("equal-condition")
                      && !$0.bestPV.isEmpty
                      && !$0.actualPV.isEmpty
                      && $0.analysisAttempts == 9
              }) == true'''
          if text.count(block_old) != 1:
              raise SystemExit(f'expected one weak diagnostic attempt assertion, got {text.count(block_old)}')
          text = text.replace(block_old, block_new, 1)
          path.write_text(text)
          PY

      - name: Verify legacy production analyzer is absent
        run: |
          if grep -R "AdaptiveComparisonAnalyzer\.analyze(" iOS/ShogiCoachPoC \
            --include='*.swift' \
            --exclude='AdaptiveComparisonAnalyzer.swift'; then
            echo "Legacy production analyzer call remains" >&2
            exit 1
          fi

      - name: Swift regression
        run: swift test

      - name: Commit corrective migration
        run: |
          if git diff --quiet; then
            echo "No corrective migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iOS/ShogiCoachPoC/SimulatorCIProbe.swift
          git commit -m "VE1-B: fix residual generic E2E diagnostic authority"
          git push origin HEAD:candidate/build19-ve1-b-implementation
