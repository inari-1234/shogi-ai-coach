name: Build19 VE1-B Generic E2E Migration

on:
  push:
    branches:
      - candidate/build19-ve1-b-implementation
    paths:
      - scripts/ve1b_generic_e2e_migrate.py
      - .github/workflows/build19-ve1-b-generic-e2e-migration.yml

permissions:
  contents: write

jobs:
  migrate:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply deterministic migration
        run: python3 scripts/ve1b_generic_e2e_migrate.py

      - name: Verify legacy production analyzer is absent
        run: |
          if grep -R "AdaptiveComparisonAnalyzer\.analyze(" iOS/ShogiCoachPoC \
            --include='*.swift' \
            --exclude='AdaptiveComparisonAnalyzer.swift'; then
            echo "Legacy production analyzer call remains" >&2
            exit 1
          fi

      - name: Swift regression
        run: swift test

      - name: Commit migration
        run: |
          if git diff --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iOS/ShogiCoachPoC/ContextAnalysisViewModel.swift iOS/ShogiCoachPoC/SimulatorCIProbe.swift
          git commit -m "VE1-B: align generic E2E and context with node authority"
          git push origin HEAD:candidate/build19-ve1-b-implementation
