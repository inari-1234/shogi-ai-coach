name: iOS Engine PoC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-poc:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand PoC source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          parts = [Path(f"artifacts/poc.part.{i:02d}").read_text() for i in range(4)]
          Path(".ci-poc.zip").write_bytes(base64.b64decode("".join(parts)))
          PY
          unzip -q .ci-poc.zip -d .ci-unpack
          rsync -a .ci-unpack/shogi-ai-coach-poc/ ./
          rm -rf .ci-unpack .ci-poc.zip
          cp ci/Project.yml Project.yml
          cp ci/Podfile Podfile
          python3 - <<'PY'
          from pathlib import Path
          p = Path("native/yaneuraou_engine.podspec")
          text = p.read_text()
          if "s.homepage" not in text:
              text = text.replace(
                  "  s.summary = 'YaneuraOu V9.00 NNUE engine bridge for the Shogi Coach PoC'\n",
                  "  s.summary = 'YaneuraOu V9.00 NNUE engine bridge for the Shogi Coach PoC'\n"
                  "  s.homepage = 'https://github.com/inari-1234/shogi-ai-coach'\n"
              )
          p.write_text(text)
          e = Path("iOS/ShogiCoachPoC/EngineProbe.swift")
          es = e.read_text()
          send_start = es.index("    func send(_ line: String) async throws {")
          send_end = es.index("    func readUntil(", send_start)
          send_block = es[send_start:send_end]
          send_block = send_block.replace(
              "withCheckedThrowingContinuation { continuation in",
              "withCheckedThrowingContinuation { (continuation: CheckedContinuation<Void, Error>) in",
              1
          )
          send_block = send_block.replace(
              "else { continuation.resume() }",
              "else { continuation.resume(returning: ()) }",
              1
          )
          es = es[:send_start] + send_block + es[send_end:]
          e.write_text(es)
          if send_block.count("CheckedContinuation<Void, Error>") != 1:
              raise SystemExit("EngineProbe send continuation patch failed")
          app = Path("iOS/ShogiCoachPoC/ShogiCoachPoCApp.swift")
          app_text = app.read_text()
          app_text = app_text.replace(
              "        WindowGroup { ContentView() }",
              "        WindowGroup { ContentView().task { await SimulatorCIProbe.runIfRequested() } }"
          )
          app.write_text(app_text)
          Path("iOS/ShogiCoachPoC/SimulatorCIProbe.swift").write_text(
              Path("ci/SimulatorCIProbe.swift").read_text()
          )
          PY

      - name: Select Xcode and show environment
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          swift --version
          uname -m

      - name: Core regression tests
        shell: bash
        run: |
          set -euo pipefail
          swift test 2>&1 | tee swift-test.log

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen p7zip cocoapods
          xcodegen --version
          pod --version

      - name: Fetch pinned YaneuraOu and NNUE
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/fetch_yaneuraou.sh scripts/fetch_eval.sh
          ./scripts/fetch_yaneuraou.sh
          ./scripts/fetch_eval.sh
          test -s iOS/ShogiCoachPoC/eval/nn.bin
          echo "YaneuraOu=$(git -C native/third_party/YaneuraOu rev-parse HEAD)"
          echo "NNUE bytes=$(stat -f%z iOS/ShogiCoachPoC/eval/nn.bin)"
          shasum -a 256 iOS/ShogiCoachPoC/eval/nn.bin

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          pod install
          test -d ShogiCoachPoC.xcworkspace

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ShogiCoachPoC.xcworkspace \
            -scheme ShogiCoachPoC \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Verify and package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP='build/DerivedData/Build/Products/Release-iphoneos/ShogiCoachPoC.app'
          test -d "$APP"
          test -x "$APP/ShogiCoachPoC"
          mkdir -p "$APP/eval"
          cp iOS/ShogiCoachPoC/eval/nn.bin "$APP/eval/nn.bin"
          test -s "$APP/eval/nn.bin"
          shasum -a 256 "$APP/eval/nn.bin"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../ShogiCoachPoC-unsigned.ipa Payload)
          shasum -a 256 ShogiCoachPoC-unsigned.ipa | tee ipa-sha256.txt
          du -h ShogiCoachPoC-unsigned.ipa

      - name: Build iOS Simulator app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ShogiCoachPoC.xcworkspace \
            -scheme ShogiCoachPoC \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/SimulatorDerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee simulator-build.log

      - name: Run simulator engine smoke test
        shell: bash
        run: |
          set -euo pipefail
          APP='build/SimulatorDerivedData/Build/Products/Release-iphonesimulator/ShogiCoachPoC.app'
          test -d "$APP"
          mkdir -p "$APP/eval"
          cp iOS/ShogiCoachPoC/eval/nn.bin "$APP/eval/nn.bin"
          test -s "$APP/eval/nn.bin"

          xcrun simctl list devices available --json > simulator-devices.json
          UDID=$(python3 - <<'PY'
          import json
          data = json.load(open("simulator-devices.json"))
          for devices in data["devices"].values():
              for device in devices:
                  if device.get("isAvailable") and "iPhone" in device.get("name", ""):
                      print(device["udid"])
                      raise SystemExit(0)
          raise SystemExit("No available iPhone simulator")
          PY
          )
          echo "Simulator UDID=$UDID"

          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"

          xcrun simctl launch "$UDID" com.inari1234.shogicoachpoc --ci-smoke 2>&1 | tee simulator-run.log

          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.inari1234.shogicoachpoc data)
          REPORT="$CONTAINER/Documents/ci-probe.txt"
          FOUND=0
          for _ in $(seq 1 90); do
            if [ -s "$REPORT" ]; then
              FOUND=1
              break
            fi
            sleep 2
          done
          test "$FOUND" -eq 1
          cp "$REPORT" simulator-result.txt
          cat simulator-result.txt

          grep -Fq "default_status=PASS候補" simulator-result.txt
          grep -Fq "bestmove:" simulator-result.txt
          grep -Fq "score:" simulator-result.txt
          grep -Fq "pv:" simulator-result.txt
          grep -Fq "ten_status=実機PASS候補" simulator-result.txt
          grep -Fq "10/10 completed" simulator-result.txt

          xcrun simctl shutdown "$UDID" 2>/dev/null || true

      - name: Upload IPA and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShogiCoachPoC-iPhone-PoC
          path: |
            ShogiCoachPoC-unsigned.ipa
            ipa-sha256.txt
            swift-test.log
            xcodebuild.log
            simulator-build.log
            simulator-run.log
            simulator-result.txt
          if-no-files-found: ignore
          retention-days: 7
