name: iOS Engine PoC

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-ios-poc:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Expand socketpair PoC source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path
          parts = [Path(f"artifacts/poc.part.{i:02d}").read_text() for i in range(4)]
          Path(".ci-poc.zip").write_bytes(base64.b64decode("".join(parts)))
          PY
          unzip -q .ci-poc.zip -d .ci-unpack
          rsync -a .ci-unpack/shogi-ai-coach-poc/ ./
          rm -rf .ci-unpack .ci-poc.zip

          cp ci/Project.yml Project.yml
          cp ci/Podfile Podfile
          cp ci/EngineProbeSocketPair.swift iOS/ShogiCoachPoC/EngineProbe.swift
          cp ci/EngineNativeSocketPair.h iOS/ShogiCoachPoC/EngineNative.h
          cp ci/engine_bridge_socketpair.cpp native/bridge/engine_bridge.cpp
          cp ci/engine_bridge_socketpair.h native/bridge/engine_bridge.h

          python3 - <<'PY'
          from pathlib import Path
          p = Path("native/yaneuraou_engine.podspec")
          text = p.read_text()
          if "s.homepage" not in text:
              text = text.replace(
                  "  s.summary = 'YaneuraOu V9.00 NNUE engine bridge for the Shogi Coach PoC'\n",
                  "  s.summary = 'YaneuraOu V9.00 NNUE engine bridge for the Shogi Coach PoC'\n"
                  "  s.homepage = 'https://github.com/inari-1234/shogi-ai-coach'\n"
              )
          p.write_text(text)
          PY

      - name: Core regression tests
        shell: bash
        run: |
          set -euo pipefail
          swift test 2>&1 | tee swift-test.log

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen p7zip cocoapods

      - name: Fetch pinned YaneuraOu and NNUE
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/fetch_yaneuraou.sh scripts/fetch_eval.sh
          ./scripts/fetch_yaneuraou.sh
          ./scripts/fetch_eval.sh
          test -s iOS/ShogiCoachPoC/eval/nn.bin

          python3 - <<'PY'
          from pathlib import Path
          p = Path("native/third_party/YaneuraOu/source/usi.h")
          text = p.read_text(encoding="utf-8-sig")
          marker = "private:\n\t// 内包している思考エンジン"
          insert = "\n".join([
              "#if !STOCKFISH",
              "    bool mobile_execute_command(const std::string& cmd) { return usi_cmdexec(cmd); }",
              "#endif",
              "",
              "private:",
              "\t// 内包している思考エンジン",
          ])
          if marker not in text:
              raise SystemExit("USIEngine private marker not found")
          text = text.replace(marker, insert, 1)
          p.write_text(text, encoding="utf-8")
          PY

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          pod install
          test -d ShogiCoachPoC.xcworkspace

      - name: Build unsigned iPhone app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ShogiCoachPoC.xcworkspace \
            -scheme ShogiCoachPoC \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build/DerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee xcodebuild.log

      - name: Verify and package IPA
        shell: bash
        run: |
          set -euo pipefail
          APP='build/DerivedData/Build/Products/Release-iphoneos/ShogiCoachPoC.app'
          test -d "$APP"
          test -x "$APP/ShogiCoachPoC"
          mkdir -p "$APP/eval"
          cp iOS/ShogiCoachPoC/eval/nn.bin "$APP/eval/nn.bin"
          test -s "$APP/eval/nn.bin"
          mkdir -p ipa/Payload
          cp -R "$APP" ipa/Payload/
          (cd ipa && zip -qry ../ShogiCoachPoC-unsigned.ipa Payload)
          shasum -a 256 ShogiCoachPoC-unsigned.ipa | tee ipa-sha256.txt
          du -h ShogiCoachPoC-unsigned.ipa

      - name: Upload IPA and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ShogiCoachPoC-iPhone-PoC
          path: |
            ShogiCoachPoC-unsigned.ipa
            ipa-sha256.txt
            swift-test.log
            xcodebuild.log
          if-no-files-found: ignore
          retention-days: 7
