name: Build18-3 Build17 Regression

on:
  push:
    branches:
      - 'candidate/build18-3-grounded-whynow'
  workflow_dispatch:

concurrency:
  group: build18-3-build17-regression-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build17-regression:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch official Denryusen KIF fixture
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/build18-3-kif
          curl --fail --location --retry 3 --retry-delay 2             'https://denryu-sen.jp/denryusen/dr4_hardware2/kif_dr4_hdw2.zip'             --output build/build18-3-denryusen.zip
          python3 - <<'PY'
          import zipfile
          from pathlib import Path
          source = Path("build/build18-3-denryusen.zip")
          destination = Path("build/build18-3-kif").resolve()
          with zipfile.ZipFile(source, metadata_encoding="cp932") as archive:
              for member in archive.infolist():
                  target = (destination / member.filename).resolve()
                  if destination not in target.parents and target != destination:
                      raise SystemExit(f"unsafe zip path: {member.filename}")
              archive.extractall(destination)
          print(f"kif_files={len(list(destination.rglob('*.kif')))}")
          PY

      - name: Run Build17 real-game audit on Build18-3 HEAD
        shell: bash
        run: |
          set -o pipefail
          swift run -c release Build17RealGameRegression --             --input-dir build/build18-3-kif             --output-json build/Build18-3_BUILD17_REAL_GAME_AUDIT.json             --output-markdown build/Build18-3_BUILD17_REAL_GAME_AUDIT.md             --target-positions 240             --max-positions-per-game 60             --min-games 4             --max-ply 100             --source-id 'denryusen:dr4-hardware2:2024'             --source-title '第2回マイナビニュース杯電竜戦統一ハードウェア戦'             --source-url 'https://denryu-sen.jp/denryusen/dr4_hardware2/dr1_live.php'             --rights-note '公式ページ: 棋譜利用は制限等ありませんので、ご自由にお使いください。'             --retrieved-date '2026-10-03'             2>&1 | tee build/build18-3-build17-regression.log

      - name: Validate Build17 regression output
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path("build/Build18-3_BUILD17_REAL_GAME_AUDIT.json").read_text(encoding="utf-8"))
          s = doc["summary"]
          f = s["frequency"]
          assert doc["schemaVersion"] == 1
          assert s["auditedGames"] >= 4
          assert s["auditedPositions"] >= 240
          assert s["blockingIssueCount"] == 0
          assert f["residualConsecutiveRepeatCount"] == 0
          assert all(item["passed"] for item in s["mandatoryRegressions"])
          assert {item["id"] for item in s["mandatoryRegressions"]} == {
              "C_build16_r1_ply59_overflow",
              "A_locked_rook_pawn_response",
              "B_bishop_line_multi_concept_priority",
          }
          print("build18_3_build17_regression=PASS")
          print("audited_games=", s["auditedGames"])
          print("audited_positions=", s["auditedPositions"])
          print("blocking_issues=", s["blockingIssueCount"])
          print("residual_consecutive_repeats=", f["residualConsecutiveRepeatCount"])
          PY

      - name: Full Swift regression and static verify
        shell: bash
        run: |
          set -euo pipefail
          swift test 2>&1 | tee build/swift-test.log
          ./scripts/verify.sh 2>&1 | tee build/static-verify.log

      - name: Record validation HEAD
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$GITHUB_SHA" > build/BUILD18_3_BUILD17_REGRESSION_HEAD.txt

      - name: Upload Build18-3 Build17 regression
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build18-3-Build17-regression
          path: |
            build/Build18-3_BUILD17_REAL_GAME_AUDIT.json
            build/Build18-3_BUILD17_REAL_GAME_AUDIT.md
            build/BUILD18_3_BUILD17_REGRESSION_HEAD.txt
            build/build18-3-build17-regression.log
            build/swift-test.log
            build/static-verify.log
          if-no-files-found: ignore
          retention-days: 14
