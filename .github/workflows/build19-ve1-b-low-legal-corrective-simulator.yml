name: Build19 VE1-B Low Legal Corrective Simulator

on:
  push:
    branches:
      - candidate/build19-ve1-c1-pilot
    paths:
      - "tools/engine-verify/fixtures/ve1b_low_legal_corrective.json"
      - "native/bridge/engine_bridge.cpp"
      - "iOS/ShogiCoachPoC/EngineUSISession.swift"
      - "iOS/ShogiCoachPoC/VE1BSearchEvidence.swift"
      - "iOS/ShogiCoachPoC/VE1BLowLegalCorrectiveFixtureProbe.swift"
      - "iOS/ShogiCoachPoC/ShogiCoachPoCApp.swift"
      - "scripts/fetch_yaneuraou.sh"
      - "scripts/fetch_eval.sh"
      - "scripts/patch_yaneuraou_ios.sh"
      - ".github/workflows/build19-ve1-b-low-legal-corrective-simulator.yml"

permissions:
  contents: read

jobs:
  corrective-simulator:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Verify static prerequisites
        shell: bash
        run: |
          set -euxo pipefail
          test "$(uname -m)" = "x86_64"
          swift test
          ./scripts/verify.sh
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('tools/engine-verify/fixtures/ve1b_low_legal_corrective.json').read_text())
          assert p['authority_parent']=='8daf78caa2bd5919cc911da21bae80fa3d12a248'
          assert p['configured_multi_pv']==3
          assert p['node_budget']==1000
          assert p['safety_ceiling_ms']==10000
          assert len(p['fixtures'])==4
          assert [x['expected_legal_root_move_count'] for x in p['fixtures']] == [1,2,3,2]
          assert [x['expected_effective_required_multi_pv'] for x in p['fixtures']] == [1,2,3,2]
          edge=p['fixtures'][3]
          assert edge['expected_legal_all_move_count']==3
          assert edge['required_omitted_nonpromotion_move']=='3c1c'
          assert edge['required_retained_promotion_move']=='3c1c+'
          PY

      - name: Restore engine assets
        uses: actions/cache@v4
        with:
          path: |
            native/third_party/YaneuraOu
            iOS/ShogiCoachPoC/eval/nn.bin
          key: shogi-engine-assets-v2-intel

      - name: Prepare pinned production engine
        shell: bash
        run: |
          set -euxo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v pod >/dev/null 2>&1 || brew install cocoapods
          if [ ! -s iOS/ShogiCoachPoC/eval/nn.bin ]; then
            command -v 7z >/dev/null 2>&1 || brew install p7zip
          fi
          chmod +x scripts/*.sh
          ./scripts/fetch_yaneuraou.sh
          ./scripts/fetch_eval.sh
          ./scripts/patch_yaneuraou_ios.sh
          test "$(git -C native/third_party/YaneuraOu rev-parse HEAD)" = \
            "a5ee2786c0030edc7d4a1cdfe94b04dffec55493"
          test "$(shasum -a 256 iOS/ShogiCoachPoC/eval/nn.bin | awk '{print $1}')" = \
            "768068f0d534a0603a5d38bcd143de6bbca820d5f1c95a14d40863e5b7892d76"

      - name: Build x86_64 corrective app
        shell: bash
        run: |
          set -euxo pipefail
          xcodegen generate
          pod install
          xcodebuild \
            -workspace ShogiCoachPoC.xcworkspace \
            -scheme ShogiCoachPoC \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/VE1BLowLegalCorrectiveDerivedData \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            GIT_COMMIT_SHA="$GITHUB_SHA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Execute four production corrective fixtures
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/ve1b-low-legal-corrective-simulator
          APP='build/VE1BLowLegalCorrectiveDerivedData/Build/Products/Release-iphonesimulator/ShogiCoachPoC.app'
          test -d "$APP"
          xcrun simctl list devices available --json > build/ve1b-low-legal-corrective-simulator/devices.json
          UDID=$(python3 - <<'PY'
          import json
          data=json.load(open('build/ve1b-low-legal-corrective-simulator/devices.json'))
          for devices in data['devices'].values():
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device.get('name',''):
                      print(device['udid'])
                      raise SystemExit(0)
          raise SystemExit('No available iPhone simulator')
          PY
          )
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.inari1234.shogicoachpoc data)
          cp tools/engine-verify/fixtures/ve1b_low_legal_corrective.json \
            "$CONTAINER/Documents/ve1b-low-legal-corrective-fixture-input.json"
          xcrun simctl launch "$UDID" com.inari1234.shogicoachpoc --ci-ve1b-low-legal-corrective-fixture \
            2>&1 | tee build/ve1b-low-legal-corrective-simulator/launch.log

          OUT="$CONTAINER/Documents/ve1b-low-legal-corrective-fixture.json"
          ERR="$CONTAINER/Documents/ve1b-low-legal-corrective-fixture-error.txt"
          DONE=0
          for _ in $(seq 1 120); do
            if [ -s "$OUT" ]; then DONE=1; break; fi
            if [ -s "$ERR" ]; then cat "$ERR"; break; fi
            sleep 1
          done
          if [ -s "$ERR" ]; then
            cp "$ERR" build/ve1b-low-legal-corrective-simulator/error.txt
          else
            : > build/ve1b-low-legal-corrective-simulator/error.txt
          fi
          test "$DONE" -eq 1
          cp "$OUT" build/ve1b-low-legal-corrective-simulator/report.json
          xcrun simctl shutdown "$UDID" 2>/dev/null || true

      - name: Gate effective MultiPV and completed node snapshots
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('build/ve1b-low-legal-corrective-simulator/report.json').read_text())
          assert p['status']=='PASS', p
          assert p['authorityParent']=='8daf78caa2bd5919cc911da21bae80fa3d12a248'
          assert p['rootMoveGenerator']=='YaneuraOu MoveList<LEGAL>'
          assert p['configuredMultiPV']==3
          assert p['nodeBudget']==1000
          assert p['fixtureCount']==4
          expected={
            'legal-1': (1,1),
            'legal-2': (2,2),
            'legal-3': (3,3),
            'legal-2-legal-all-3-rook-nonpromotion-boundary': (2,2),
          }
          assert set(expected)=={x['id'] for x in p['fixtures']}
          for row in p['fixtures']:
              legal,effective=expected[row['id']]
              assert row['configuredMultiPV']==3
              assert row['legalRootMoveCount']==legal
              assert row['effectiveRequiredMultiPV']==effective
              assert row['completion']=='node_budget_reached'
              assert row['adoptedSnapshotRankCount']==effective
              assert row['maxObservedNodes']>=1000
              assert row['issuedGoCommand']=='go nodes 1000'
              assert row['passed'] is True
          print('VE1-B low-LEGAL corrective simulator fixtures: PASS')
          PY

      - name: Upload corrective fixture evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build19-VE1-B-low-legal-corrective-simulator
          path: build/ve1b-low-legal-corrective-simulator
          if-no-files-found: error
          retention-days: 30
