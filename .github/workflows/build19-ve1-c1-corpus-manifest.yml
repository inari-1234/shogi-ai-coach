name: Build19 VE1-C1 Corpus Manifest

on:
  push:
    branches:
      - candidate/build19-ve1-c1-pilot
    paths:
      - "Build19/BUILD19_VE1_C1_PRE_POOL_CONTRACT_20261014.md"
      - "Build19/BUILD19_VE1_C1_CANDIDATE_GAME_CORPUS_20261014.json"
      - "tools/engine-verify/ve1c1_corpus_manifest.py"
      - ".github/workflows/build19-ve1-c1-corpus-manifest.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  corpus-manifest:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Static compile
        run: |
          set -euxo pipefail
          python3 -m py_compile tools/engine-verify/ve1c1_corpus_manifest.py

      - name: Fetch frozen candidate source archive
        run: |
          set -euxo pipefail
          mkdir -p build/ve1c1-corpus
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://denryu-sen.jp/denryusen/dr4_hardware2/kif_dr4_hdw2.zip' \
            --output build/ve1c1-corpus/kif_dr4_hdw2.zip
          sha256sum build/ve1c1-corpus/kif_dr4_hdw2.zip | tee build/ve1c1-corpus/archive-sha256.txt

      - name: Generate deterministic corpus manifest and seeded order
        run: |
          set -euxo pipefail
          python3 tools/engine-verify/ve1c1_corpus_manifest.py build \
            --archive build/ve1c1-corpus/kif_dr4_hdw2.zip \
            --output build/ve1c1-corpus/candidate-game-corpus.json
          python3 tools/engine-verify/ve1c1_corpus_manifest.py plan \
            --manifest build/ve1c1-corpus/candidate-game-corpus.json \
            --output build/ve1c1-corpus/seeded-game-order.json

      - name: Verify committed authority when present
        run: |
          set -euxo pipefail
          AUTH='Build19/BUILD19_VE1_C1_CANDIDATE_GAME_CORPUS_20261014.json'
          if [ -f "$AUTH" ]; then
            python3 tools/engine-verify/ve1c1_corpus_manifest.py verify \
              --archive build/ve1c1-corpus/kif_dr4_hdw2.zip \
              --manifest "$AUTH"
            cmp -s "$AUTH" build/ve1c1-corpus/candidate-game-corpus.json
            echo 'committed_corpus_authority=PASS' | tee build/ve1c1-corpus/authority-status.txt
          else
            echo 'committed_corpus_authority=NOT_YET_COMMITTED' | tee build/ve1c1-corpus/authority-status.txt
          fi

      - name: Upload manifest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build19-VE1-C1-corpus-manifest
          path: build/ve1c1-corpus
          if-no-files-found: error
          retention-days: 30
