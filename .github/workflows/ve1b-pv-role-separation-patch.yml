name: VE1-B PV Role Separation Patch

on:
  push:
    branches:
      - candidate/build19-ve1-b-pv-role-separation

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[pv-role-patched]') }}
    runs-on: macos-15
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/build19-ve1-b-pv-role-separation
          fetch-depth: 0

      - name: Apply strict PV-role patch
        run: |
          set -euo pipefail
          python3 scripts/apply_ve1b_pv_role_separation.py
          git diff --check

      - name: Core regression
        run: |
          set -euo pipefail
          swift test
          ./scripts/verify.sh

      - name: Commit implementation
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No implementation diff produced' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add iOS/ShogiCoachPoC/ReasonAnalysisViewModel.swift \
                  iOS/ShogiCoachPoC/ContinuationSimulationViewModel.swift \
                  iOS/ShogiCoachPoC/RecommendationDecisionPresentation.swift \
                  iOS/ShogiCoachPoC/RecommendationDecisionPolicyAudit.swift \
                  iOS/ShogiCoachPoC/SimulatorCIProbe.swift
          git commit -m '[pv-role-patched] VE1-B separate confirmed and reference PV roles'
          git push origin HEAD:candidate/build19-ve1-b-pv-role-separation
