name: Build19 VE1-C1 Production Pool

on:
  push:
    branches:
      - candidate/build19-ve1-c1-pilot
    paths:
      - "Build19/BUILD19_VE1_C1_B6_X86_SHALLOW_PARITY_20261014.json"

permissions:
  contents: write

jobs:
  production-pool:
    runs-on: macos-15-intel
    timeout-minutes: 90
    steps:
      - name: Checkout post-parity candidate
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify committed pre-pool authorities
        shell: bash
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          parity=Path('Build19/BUILD19_VE1_C1_B6_X86_SHALLOW_PARITY_20261014.json')
          corpus=Path('Build19/BUILD19_VE1_C1_CANDIDATE_GAME_CORPUS_20261014.json')
          order=Path('Build19/BUILD19_VE1_C1_SEEDED_GAME_ORDER_20261014.json')
          for p in (parity, corpus, order):
              assert p.is_file(), p
          p=json.loads(parity.read_text(encoding='utf-8'))
          assert p['status']=='PASS'
          assert p['architecture']=='x86_64'
          assert p['matched_positions']==81
          assert p['mismatch_count']==0
          assert p['physical_report_sha256']=='fe63385d97293ae8cb7a577618ae66d7592d57b2960dcc899bcf93b51ff4a2a9'
          assert p['fixture_sha256']=='ea8a9e4b0211c5c6fde7514987df74d17508f8b59f72b7969a1105ce1fd94102'
          print('pre_pool_authorities=PASS')
          PY
          test "$(uname -m)" = "x86_64"
          swift test
          ./scripts/verify.sh
          python3 -m py_compile \
            tools/engine-verify/ve1c1_corpus_manifest.py \
            tools/engine-verify/ve1c1_pool_input.py \
            tools/engine-verify/ve1c1_pilot.py \
            tools/engine-verify/ve1c1_pool_freeze.py

      - name: Fetch and verify frozen candidate corpus
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p build/ve1c1-pool
          curl --fail --location --retry 3 --retry-delay 2 \
            'https://denryu-sen.jp/denryusen/dr4_hardware2/kif_dr4_hdw2.zip' \
            --output build/ve1c1-pool/kif_dr4_hdw2.zip
          python3 tools/engine-verify/ve1c1_corpus_manifest.py verify \
            --archive build/ve1c1-pool/kif_dr4_hdw2.zip \
            --manifest Build19/BUILD19_VE1_C1_CANDIDATE_GAME_CORPUS_20261014.json
          python3 tools/engine-verify/ve1c1_pool_input.py \
            --archive build/ve1c1-pool/kif_dr4_hdw2.zip \
            --manifest Build19/BUILD19_VE1_C1_CANDIDATE_GAME_CORPUS_20261014.json \
            --output-dir build/ve1c1-pool/input
          cmp -s \
            Build19/BUILD19_VE1_C1_SEEDED_GAME_ORDER_20261014.json \
            build/ve1c1-pool/input/seeded-game-order.json

      - name: Restore engine assets
        uses: actions/cache@v4
        with:
          path: |
            native/third_party/YaneuraOu
            iOS/ShogiCoachPoC/eval/nn.bin
          key: shogi-engine-assets-v2-intel

      - name: Install build tools and prepare frozen engine
        shell: bash
        run: |
          set -euxo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v pod >/dev/null 2>&1 || brew install cocoapods
          if [ ! -s iOS/ShogiCoachPoC/eval/nn.bin ]; then
            command -v 7z >/dev/null 2>&1 || brew install p7zip
          fi
          chmod +x scripts/*.sh
          ./scripts/fetch_yaneuraou.sh
          ./scripts/fetch_eval.sh
          ./scripts/patch_yaneuraou_ios.sh
          test "$(shasum -a 256 iOS/ShogiCoachPoC/eval/nn.bin | awk '{print $1}')" = "768068f0d534a0603a5d38bcd143de6bbca820d5f1c95a14d40863e5b7892d76"

      - name: Build x86_64 production-selector app
        shell: bash
        run: |
          set -euxo pipefail
          xcodegen generate
          pod install
          xcodebuild \
            -workspace ShogiCoachPoC.xcworkspace \
            -scheme ShogiCoachPoC \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/VE1C1PoolDerivedData \
            ARCHS=x86_64 \
            ONLY_ACTIVE_ARCH=YES \
            GIT_COMMIT_SHA="$GITHUB_SHA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Run actual frozen production selector in seeded game order
        shell: bash
        run: |
          set -euxo pipefail
          APP='build/VE1C1PoolDerivedData/Build/Products/Release-iphonesimulator/ShogiCoachPoC.app'
          test -d "$APP"
          xcrun simctl list devices available --json > build/ve1c1-pool/devices.json
          UDID=$(python3 - <<'PY'
          import json
          data=json.load(open('build/ve1c1-pool/devices.json'))
          for devices in data['devices'].values():
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device.get('name',''):
                      print(device['udid'])
                      raise SystemExit(0)
          raise SystemExit('No available iPhone simulator')
          PY
          )
          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.inari1234.shogicoachpoc data)
          rm -rf "$CONTAINER/Documents/ve1c1-pool-input"
          cp -R build/ve1c1-pool/input "$CONTAINER/Documents/ve1c1-pool-input"
          xcrun simctl launch "$UDID" com.inari1234.shogicoachpoc --ci-ve1c1-production-pool \
            2>&1 | tee build/ve1c1-pool/launch.log

          OUT="$CONTAINER/Documents/ve1c1-production-pool.json"
          ERR="$CONTAINER/Documents/ve1c1-production-pool-error.txt"
          STAGE="$CONTAINER/Documents/ci-stage.txt"
          DONE=0
          for _ in $(seq 1 2400); do
            if [ -s "$OUT" ]; then DONE=1; break; fi
            if [ -s "$ERR" ]; then cat "$ERR"; break; fi
            sleep 2
          done
          if [ -s "$STAGE" ]; then cp "$STAGE" build/ve1c1-pool/stage.txt; else echo 'no-stage' > build/ve1c1-pool/stage.txt; fi
          if [ -s "$ERR" ]; then cp "$ERR" build/ve1c1-pool/error.txt; else : > build/ve1c1-pool/error.txt; fi
          test "$DONE" -eq 1
          cp "$OUT" build/ve1c1-pool/production-pool-raw.json
          xcrun simctl shutdown "$UDID" 2>/dev/null || true

      - name: Derive frozen 16-position manifest and VE1-D exclusion authority
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/engine-verify/ve1c1_pilot.py select \
            --pool build/ve1c1-pool/production-pool-raw.json \
            --output build/ve1c1-pool/natural-pilot-manifest.json
          python3 tools/engine-verify/ve1c1_pool_freeze.py \
            --pool build/ve1c1-pool/production-pool-raw.json \
            --pilot-manifest build/ve1c1-pool/natural-pilot-manifest.json \
            --pool-output build/ve1c1-pool/production-pool.json \
            --exclusion-output build/ve1c1-pool/ve1d-exclusion-authority.json

      - name: Commit pool, manifest and exclusion before any natural pilot
        shell: bash
        run: |
          set -euxo pipefail
          POOL='Build19/BUILD19_VE1_C1_PRODUCTION_POOL_20261014.json'
          PILOT='Build19/BUILD19_VE1_C1_NATURAL_PILOT_MANIFEST_20261014.json'
          EXCL='Build19/BUILD19_VE1_D_EXCLUSION_AUTHORITY_20261014.json'
          for target in "$POOL" "$PILOT" "$EXCL"; do
            test ! -e "$target"
          done
          cp build/ve1c1-pool/production-pool.json "$POOL"
          cp build/ve1c1-pool/natural-pilot-manifest.json "$PILOT"
          cp build/ve1c1-pool/ve1d-exclusion-authority.json "$EXCL"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$POOL" "$PILOT" "$EXCL"
          git commit -m 'VE1-C1: freeze production pool, natural pilot manifest, and VE1-D exclusions'
          git push origin HEAD:candidate/build19-ve1-c1-pilot

      - name: Upload pre-pilot pool evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build19-VE1-C1-production-pool
          path: build/ve1c1-pool
          if-no-files-found: error
          retention-days: 30
