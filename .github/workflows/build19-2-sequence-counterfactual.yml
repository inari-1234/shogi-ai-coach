name: Build19-2 Sequence Counterfactual Evidence

on:
  push:
    branches:
      - 'candidate/build19-2-sequence-counterfactual-evidence'
  workflow_dispatch:

concurrency:
  group: build19-2-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build19-1 authority and scope guard
        shell: bash
        run: |
          set -euo pipefail
          BASE=07fac474b723d35d49093adce5e5e886acf600da
          git cat-file -e "$BASE^{commit}"
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --exit-code "$BASE"...HEAD -- \
            Sources/ShogiCoachCore/ContextEngine.swift \
            Sources/ShogiCoachCore/ContextExplanation.swift \
            Sources/ShogiCoachCore/GroundedExplanationContext.swift \
            Sources/ShogiCoachCore/CandidateComparisonTypes.swift \
            Sources/ShogiCoachCore/CandidateAnalysisResolver.swift \
            Sources/ShogiCoachCore/CandidateComparisonResolver.swift \
            Sources/ShogiCoachCore/CandidateComparisonResolverDefaults.swift \
            Sources/ShogiCoachCore/CandidateComparisonDiagnostic.swift \
            Sources/ShogiCoachCore/BoardTacticalMetricResolver.swift \
            Build18 \
            Build19/BUILD19_1_ARCHITECTURE_20261005.md \
            Build19/BUILD19_1_COMPARISON_DATA_CONTRACT_20261005.json \
            Build19/BUILD19_1_DIFFERENCE_EVIDENCE_SCHEMA_20261005.json \
            Build19/BUILD19_1_GROUNDED_AXIS_MATRIX_20261005.json \
            Build19/BUILD19_1_UNIT_TEST_RESULTS_20261005.json \
            Build19/BUILD19_1_REAL_GAME_FIXTURE_RESULTS_20261005.json \
            Build19/BUILD19_1_REGRESSION_RESULTS_20261005.json \
            Build19/BUILD19_1_FINAL_REPORT_20261005.md
          changed="$(git diff --name-only "$BASE"...HEAD -- Sources/ShogiCoachCore)"
          unexpected="$(printf '%s\n' "$changed" | grep -v -E '^Sources/ShogiCoachCore/(SequenceCounterfactualEvidence|SequenceExchangeEvidence)\.swift$' | sed '/^$/d' || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected production-core change:" >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('Build18/BUILD18_5A_DECISION_MANIFEST_20261004.json').read_text())
          expected={
            'respond_to_rapid_attack':'HOLD',
            'sabai':'HOLD',
            'trade_to_transform':'HOLD',
            'multi_threat':'HOLD',
            'tempo_management':'HOLD',
          }
          assert d['decisions'] == expected
          print('build19_1_authority_scope_guard=PASS')
          PY

      - name: Dedicated sequence counterfactual tests
        shell: bash
        run: |
          set -euo pipefail
          swift test --filter SequenceCounterfactualEvidenceTests 2>&1 | tee build19-2-sequence-tests.log

      - name: Build19-1 comparison regression
        shell: bash
        run: |
          set -euo pipefail
          swift test --filter CandidateComparison 2>&1 | tee build19-1-comparison.log

      - name: Build18 protected regression
        shell: bash
        run: |
          set -euo pipefail
          swift test --filter Build17SafeConcept 2>&1 | tee build17-safe.log
          swift test --filter Build18GroundedWhyNowTests 2>&1 | tee build18-whynow.log
          swift test --filter Build18FrozenCorpusProjectionTests 2>&1 | tee build18-frozen-corpus.log

      - name: Full Swift regression and static verify
        shell: bash
        run: |
          set -euo pipefail
          swift test 2>&1 | tee swift-test-full.log
          ./scripts/verify.sh 2>&1 | tee static-verify.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build19-2-validation-logs
          path: |
            build19-2-sequence-tests.log
            build19-1-comparison.log
            build17-safe.log
            build18-whynow.log
            build18-frozen-corpus.log
            swift-test-full.log
            static-verify.log
          if-no-files-found: ignore
          retention-days: 14
