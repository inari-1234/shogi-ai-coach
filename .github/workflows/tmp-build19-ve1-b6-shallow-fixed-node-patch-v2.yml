name: TEMP B6 Shallow Fixed-Node Patch V2

on:
  push:
    branches:
      - candidate/build19-ve1-b6-shallow-fixed-node

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: candidate/build19-ve1-b6-shallow-fixed-node
          fetch-depth: 0
      - name: Apply patch script
        run: python3 tools/tmp_apply_b6_shallow_fixed_node_harness_patch.py
      - name: Commit patched harness
        run: |
          if git diff --quiet -- iOS/ShogiCoachPoC/VE1BPhysicalQualificationView.swift; then
            echo "No harness diff to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iOS/ShogiCoachPoC/VE1BPhysicalQualificationView.swift
          git commit -m "Build19 VE1-B: apply shallow fixed-node harness patch"
          git push origin HEAD:candidate/build19-ve1-b6-shallow-fixed-node
