name: Build19 VE1-C1 Frozen Swift Stability Replay

on:
  push:
    branches:
      - candidate/build19-ve1-c1-pilot
    paths:
      - "Sources/VE1C1PilotStability/main.swift"
      - "Package.swift"
      - ".github/workflows/build19-ve1-c1-pilot-stability-replay.yml"
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  frozen-stability:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Download original immutable natural pilot evidence
        uses: actions/download-artifact@v4
        with:
          name: Build19-VE1-C1-natural-16-pilot
          repository: inari-1234/shogi-ai-coach
          run-id: 42413155051
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: build/frozen-pilot

      - name: Build and test original frozen Swift VE1B Stability implementation
        shell: bash
        run: |
          set -euxo pipefail
          swift test
          swift build -c release --product VE1C1PilotStability

      - name: Classify the original 16 App measurement tiers without engine rerun
        shell: bash
        run: |
          set -euxo pipefail
          swift run -c release VE1C1PilotStability \
            build/frozen-pilot/pilot-result.json \
            build/ve1c1-stability-replay/report.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("build/ve1c1-stability-replay/report.json").read_text())
          assert r["status"]=="REPORT_ONLY"
          assert r["position_count"]==16
          assert r["frozen_result_sha256"]=="860cb704e8df15e301b037b9994ff2bb15c3cbcb8a14440cdfa15e46797214ea"
          assert r["explicit_non_promotion"] is True
          assert r["stable_count"]==4,r["stable_ids"]
          assert set(r["stable_ids"])=={"p08-ply-81","p09-ply-7","p10-ply-138","p12-ply-126"}
          print("swift_frozen_VE1BStability_16_positions=PASS")
          print("note_C1_played_certainty_independent_from_VE1BStability")
          PY

      - name: Retain Swift source-derived stability states, no pilot mutation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build19-VE1-C1-frozen-Swift-stability
          path: build/ve1c1-stability-replay
          if-no-files-found: warn
          retention-days: 30
