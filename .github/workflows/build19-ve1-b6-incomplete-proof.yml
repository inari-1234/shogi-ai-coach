name: iOS Simulator E2E

on:
  push:
    branches:
      - candidate/build19-ve1-b6-incomplete-evidence
  workflow_dispatch:

concurrency:
  group: build19-ve1-b6-incomplete-proof-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  b6-incomplete-state-proof:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore engine assets
        uses: actions/cache@v4
        with:
          path: |
            native/third_party/YaneuraOu
            iOS/ShogiCoachPoC/eval/nn.bin
          key: shogi-engine-assets-v2

      - name: Core regression tests
        shell: bash
        run: |
          set -euo pipefail
          swift test 2>&1 | tee b6-proof-swift-test.log
          ./scripts/verify.sh

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v pod >/dev/null 2>&1 || brew install cocoapods
          if [ ! -s iOS/ShogiCoachPoC/eval/nn.bin ]; then
            command -v 7z >/dev/null 2>&1 || brew install p7zip
          fi

      - name: Prepare pinned engine
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/fetch_yaneuraou.sh
          ./scripts/fetch_eval.sh
          ./scripts/patch_yaneuraou_ios.sh
          test -s iOS/ShogiCoachPoC/eval/nn.bin

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          pod install
          test -d ShogiCoachPoC.xcworkspace

      - name: Build Simulator proof app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ShogiCoachPoC.xcworkspace \
            -scheme ShogiCoachPoC \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/B6ProofDerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            GIT_COMMIT_SHA="$GITHUB_SHA" \
            B6_INCOMPLETE_PROOF_RUN_ID="simulator-proof" \
            B6_INCOMPLETE_PROOF_RESULT="PENDING" \
            B6_INCOMPLETE_PROOF_TEST_NAME="B6IncompleteStateProductionAbortProbe" \
            B6_INCOMPLETE_PROOF_WORKFLOW="iOS Simulator E2E" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee b6-proof-simulator-build.log

      - name: Exercise real safety-abort production path
        shell: bash
        run: |
          set -euo pipefail
          APP='build/B6ProofDerivedData/Build/Products/Release-iphonesimulator/ShogiCoachPoC.app'
          test -d "$APP"
          test -s "$APP/eval/nn.bin"

          xcrun simctl list devices available --json > b6-proof-simulator-devices.json
          UDID=$(python3 - <<'PY'
          import json
          data = json.load(open('b6-proof-simulator-devices.json'))
          for devices in data['devices'].values():
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device.get('name', ''):
                      print(device['udid'])
                      raise SystemExit(0)
          raise SystemExit('No available iPhone simulator')
          PY
          )

          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.inari1234.shogicoachpoc --ci-b6-incomplete 2>&1 | tee b6-proof-simulator-run.log

          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.inari1234.shogicoachpoc data)
          RUNTIME="$CONTAINER/Documents/b6-incomplete-state-runtime.json"
          FOUND=0
          for _ in $(seq 1 60); do
            if [ -s "$RUNTIME" ]; then
              FOUND=1
              break
            fi
            sleep 1
          done
          test "$FOUND" -eq 1
          cp "$RUNTIME" b6-incomplete-state-runtime.json
          cat b6-incomplete-state-runtime.json

          python3 - <<'PY'
          import json
          import os
          from pathlib import Path

          runtime = json.loads(Path('b6-incomplete-state-runtime.json').read_text(encoding='utf-8'))
          assert runtime['testName'] == 'B6IncompleteStateProductionAbortProbe'
          assert runtime['result'] == 'PASS'
          assert runtime['runState'] == 'incomplete'
          assert runtime['displayStatus'].startswith('深掘り 未完了（')
          assert runtime['recommendationSuppressed'] is True
          assert runtime['lossSuppressed'] is True
          assert runtime['evidenceSaved'] is True
          assert runtime['incompleteAttemptCount'] >= 1
          states = set(runtime['completionStates'])
          assert 'safety_aborted' in states
          assert 'node_budget_reached' not in states
          assert 'proven_mate_termination' not in states

          proof = {
              'schemaVersion': 1,
              'testName': runtime['testName'],
              'workflow': 'iOS Simulator E2E',
              'workflowFile': 'build19-ve1-b6-incomplete-proof.yml',
              'ciRunID': os.environ['GITHUB_RUN_ID'],
              'ciRunAttempt': os.environ.get('GITHUB_RUN_ATTEMPT', '1'),
              'gitCommit': os.environ['GITHUB_SHA'],
              'result': 'PASS',
              'runtimeProof': runtime,
          }
          Path('b6-incomplete-state-proof.json').write_text(
              json.dumps(proof, ensure_ascii=False, indent=2, sort_keys=True) + '\n',
              encoding='utf-8',
          )
          print(f"b6_incomplete_state_status=PASS run_id={proof['ciRunID']}")
          PY

          xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate 'process == "ShogiCoachPoC"' > b6-proof-simulator-system.log 2>&1 || true
          xcrun simctl shutdown "$UDID" 2>/dev/null || true

      - name: Upload B6 incomplete-state proof
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build19-VE1-B6-Incomplete-State-Proof
          path: |
            b6-incomplete-state-runtime.json
            b6-incomplete-state-proof.json
            b6-proof-swift-test.log
            b6-proof-simulator-build.log
            b6-proof-simulator-run.log
            b6-proof-simulator-system.log
          if-no-files-found: ignore
          retention-days: 14
