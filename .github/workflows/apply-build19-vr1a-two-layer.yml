name: Apply Build19-VR1A two-layer HDS patch

on:
  push:
    branches:
      - candidate/build19-vr1a-hds-machine-gate-r1
    paths:
      - Build19/BUILD19_VR1A_TWO_LAYER.patch
      - .github/workflows/apply-build19-vr1a-two-layer.yml

permissions:
  contents: write

jobs:
  apply-source-patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply staged source patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH=Build19/BUILD19_VR1A_TWO_LAYER.patch
          if [ ! -f "$PATCH" ]; then
            echo "No staged patch; nothing to do."
            exit 0
          fi
          git apply --check "$PATCH"
          git apply "$PATCH"
          rm "$PATCH"
          swiftc -parse iOS/ShogiCoachPoC/SimulatorCIProbe.swift
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add iOS/ShogiCoachPoC/SimulatorCIProbe.swift "$PATCH"
          git commit -m "Build19-VR1A split live and frozen HDS regression"
          git push origin HEAD:${GITHUB_REF_NAME}
