name: Build19 VE1-B Simulator E2E

on:
  push:
    branches:
      - candidate/build19-ve1-b-implementation
  workflow_dispatch:

concurrency:
  group: build19-ve1-b-simulator-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  simulator-ve1b:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Restore engine assets
        uses: actions/cache@v4
        with:
          path: |
            native/third_party/YaneuraOu
            iOS/ShogiCoachPoC/eval/nn.bin
          key: shogi-engine-assets-v2

      - name: Core regression
        shell: bash
        run: |
          set -euo pipefail
          swift test 2>&1 | tee ve1b-simulator-swift-test.log
          ./scripts/verify.sh

      - name: Install build tools
        shell: bash
        run: |
          set -euo pipefail
          command -v xcodegen >/dev/null 2>&1 || brew install xcodegen
          command -v pod >/dev/null 2>&1 || brew install cocoapods
          if [ ! -s iOS/ShogiCoachPoC/eval/nn.bin ]; then
            command -v 7z >/dev/null 2>&1 || brew install p7zip
          fi

      - name: Prepare pinned engine
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/*.sh
          ./scripts/fetch_yaneuraou.sh
          ./scripts/fetch_eval.sh
          ./scripts/patch_yaneuraou_ios.sh
          test -s iOS/ShogiCoachPoC/eval/nn.bin

      - name: Generate Xcode project
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          pod install
          test -d ShogiCoachPoC.xcworkspace

      - name: Build Simulator app
        shell: bash
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ShogiCoachPoC.xcworkspace \
            -scheme ShogiCoachPoC \
            -configuration Release \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/VE1BSimulatorDerivedData \
            ARCHS=arm64 \
            ONLY_ACTIVE_ARCH=YES \
            GIT_COMMIT_SHA="$GITHUB_SHA" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee ve1b-simulator-build.log

      - name: Run VE1-B production-path probe
        shell: bash
        run: |
          set -euo pipefail
          APP='build/VE1BSimulatorDerivedData/Build/Products/Release-iphonesimulator/ShogiCoachPoC.app'
          test -d "$APP"
          test -s "$APP/eval/nn.bin"

          xcrun simctl list devices available --json > ve1b-simulator-devices.json
          UDID=$(python3 - <<'PY'
          import json
          data = json.load(open('ve1b-simulator-devices.json'))
          for devices in data['devices'].values():
              for device in devices:
                  if device.get('isAvailable') and 'iPhone' in device.get('name', ''):
                      print(device['udid'])
                      raise SystemExit(0)
          raise SystemExit('No available iPhone simulator')
          PY
          )

          xcrun simctl boot "$UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl launch "$UDID" com.inari1234.shogicoachpoc --ve1b-ci-smoke \
            2>&1 | tee ve1b-simulator-run.log

          CONTAINER=$(xcrun simctl get_app_container "$UDID" com.inari1234.shogicoachpoc data)
          REPORT="$CONTAINER/Documents/ve1b-ci-probe.txt"
          STAGE="$CONTAINER/Documents/ci-stage.txt"
          EVIDENCE="$CONTAINER/Documents/ve1b-search-evidence.json"

          DONE=0
          for _ in $(seq 1 75); do
            if [ -s "$REPORT" ] && grep -Eq '^stage=(complete|failed)$' "$REPORT"; then
              DONE=1
              break
            fi
            sleep 2
          done

          if [ -s "$REPORT" ]; then cp "$REPORT" ve1b-simulator-result.txt; else echo 'stage=no_report' > ve1b-simulator-result.txt; fi
          if [ -s "$STAGE" ]; then cp "$STAGE" ve1b-simulator-stage.txt; else echo 'stage=no_stage_file' > ve1b-simulator-stage.txt; fi
          if [ -s "$EVIDENCE" ]; then cp "$EVIDENCE" ve1b-search-evidence.json; else echo '{}' > ve1b-search-evidence.json; fi
          xcrun simctl spawn "$UDID" log show --last 5m --style compact \
            --predicate 'process == "ShogiCoachPoC"' > ve1b-simulator-system.log 2>&1 || true
          xcrun simctl shutdown "$UDID" 2>/dev/null || true

          cat ve1b-simulator-result.txt
          echo '--- stage trace ---'
          tail -n 160 ve1b-simulator-stage.txt

          test "$DONE" -eq 1
          grep -Fq 'stage=complete' ve1b-simulator-result.txt
          grep -Fq 've1b_status=PASS' ve1b-simulator-result.txt
          grep -Fq 'shallow_status=PASS' ve1b-simulator-result.txt
          grep -Fq 'deep_status=PASS' ve1b-simulator-result.txt
          grep -Fq 'deep_count=3' ve1b-simulator-result.txt
          grep -Fq 'node_policy=UNFROZEN_CALIBRATION' ve1b-simulator-result.txt
          grep -Fq 'discovery_tiers=50000,100000,200000' ve1b-simulator-result.txt
          grep -Fq 'confirmation_tiers=50000,100000,200000' ve1b-simulator-result.txt
          grep -Fq 'evidence_schema=2' ve1b-simulator-result.txt
          grep -Fq 'evidence_positions=3' ve1b-simulator-result.txt
          grep -Fq 'incomplete_attempts=0' ve1b-simulator-result.txt

          python3 - <<'PY'
          import json
          from pathlib import Path
          doc = json.loads(Path('ve1b-search-evidence.json').read_text(encoding='utf-8'))
          assert doc['schemaVersion'] == 2
          assert doc['status'] == '深掘り PASS'
          assert doc['policyAuthorityStatus'] == 'UNFROZEN_CALIBRATION'
          assert doc['candidateDiscoveryNodeTiers'] == [50000, 100000, 200000]
          assert doc['confirmationNodeTiers'] == [50000, 100000, 200000]
          assert len(doc['positions']) == 3
          assert doc['incompleteAttempts'] == []
          for position in doc['positions']:
              attempts = position['attempts']
              assert len(attempts) == 6
              discovery = attempts[:3]
              comparison = attempts[3:]
              assert [a['role'] for a in discovery] == ['candidate_discovery'] * 3
              assert [a['nodeBudget'] for a in discovery] == [50000, 100000, 200000]
              assert len({a['ttGeneration'] for a in discovery}) == 3
              assert [a['role'] for a in comparison] == ['direct_comparison', 'confirmation', 'confirmation']
              assert [a['nodeBudget'] for a in comparison] == [50000, 100000, 200000]
              assert len({a['ttGeneration'] for a in comparison}) == 1
              assert discovery[-1]['ttGeneration'] < comparison[0]['ttGeneration']
              assert all(a['completion'] == 'node_budget_reached' for a in attempts)
          print('ve1b_simulator_evidence_audit=PASS')
          PY

      - name: Upload VE1-B Simulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build19-VE1-B-simulator-e2e-evidence
          path: |
            ve1b-simulator-result.txt
            ve1b-simulator-stage.txt
            ve1b-search-evidence.json
            ve1b-simulator-system.log
            ve1b-simulator-run.log
            ve1b-simulator-build.log
            ve1b-simulator-swift-test.log
          if-no-files-found: warn
          retention-days: 30
