name: ShogiCoachPoC
options:
  bundleIdPrefix: com.inari1234
  deploymentTarget:
    iOS: "16.0"
packages:
  ShogiCoachCore:
    path: .
targets:
  ShogiCoachPoC:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: iOS/ShogiCoachPoC
        excludes:
          - eval
    resources:
      - path: iOS/ShogiCoachPoC/eval
        type: folder
    dependencies:
      - package: ShogiCoachCore
    info:
      path: iOS/ShogiCoachPoC/Info.plist
      properties:
        CFBundleDisplayName: Shogi Coach PoC
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        GitCommit: "$(GIT_COMMIT_SHA)"
        UILaunchScreen: {}
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.inari1234.shogicoachpoc
        PRODUCT_NAME: ShogiCoachPoC
        MARKETING_VERSION: "0.6.0"
        CURRENT_PROJECT_VERSION: "9"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Shogi Coach PoC
        INFOPLIST_KEY_GitCommit: "$(GIT_COMMIT_SHA)"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        SWIFT_VERSION: "5.9"
        SWIFT_OBJC_BRIDGING_HEADER: "$(SRCROOT)/iOS/ShogiCoachPoC/ShogiCoachPoC-Bridging-Header.h"
        TARGETED_DEVICE_FAMILY: "1"
        IPHONEOS_DEPLOYMENT_TARGET: "16.0"
        CODE_SIGN_STYLE: Automatic
        DEAD_CODE_STRIPPING: NO
        OTHER_LDFLAGS: "$(inherited) -lc++ -Wl,-force_load,$(PODS_CONFIGURATION_BUILD_DIR)/yaneuraou_engine/libyaneuraou_engine.a"
schemes:
  ShogiCoachPoC:
    build:
      targets:
        ShogiCoachPoC: all
    run:
      config: Debug
    archive:
      config: Release
